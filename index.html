<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOY CHIN PSA — 業務系統</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; display: flex; }
.sidebar { width: 210px; min-height: 100vh; background: #1a1a1a; flex-shrink: 0; display: flex; flex-direction: column; }
.sidebar-logo { padding: 20px 18px 16px; border-bottom: 1px solid #2a2a2a; }
.sidebar-logo h1 { font-size: 13px; font-weight: 600; color: #fff; line-height: 1.4; }
.sidebar-logo p { font-size: 10px; color: #555; margin-top: 3px; }
.sidebar-nav { flex: 1; padding: 10px 0; }
.nav-section { font-size: 10px; color: #444; padding: 10px 18px 4px; letter-spacing: 0.8px; text-transform: uppercase; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 9px 18px; font-size: 12px; color: #777; cursor: pointer; border: none; background: none; width: 100%; text-align: left; transition: all 0.12s; }
.nav-item:hover { color: #fff; background: #242424; }
.nav-item.active { color: #fff; background: #0F6E56; }
.nav-icon { font-size: 14px; width: 16px; text-align: center; flex-shrink: 0; }
.sidebar-footer { padding: 14px 18px; border-top: 1px solid #242424; font-size: 10px; color: #444; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
.topbar { background: #fff; border-bottom: 1px solid #e5e5e0; padding: 13px 24px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.topbar-title { font-size: 14px; font-weight: 600; color: #1a1a1a; }
.content { padding: 20px 24px; }
.card { background: #fff; border-radius: 12px; padding: 18px 20px; border: 1px solid #e5e5e0; margin-bottom: 14px; }
.btn { padding: 7px 14px; border-radius: 8px; border: none; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.12s; }
.btn-primary { background: #0F6E56; color: #fff; }
.btn-primary:hover { background: #085041; }
.btn-blue { background: #185FA5; color: #fff; }
.btn-ghost { background: transparent; color: #666; border: 1px solid #e5e5e0; }
.btn-ghost:hover { background: #f5f5f0; }
.btn-sm { padding: 4px 10px; font-size: 11px; }
input, select, textarea { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid #e5e5e0; font-size: 12px; color: #1a1a1a; background: #fff; font-family: inherit; transition: border 0.12s; box-sizing: border-box; height: 36px; }
textarea { height: auto; min-height: 72px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: #0F6E56; }
textarea { resize: vertical; min-height: 72px; }
label { font-size: 11px; color: #666; display: block; margin-bottom: 4px; }
.req { color: #A32D2D; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 500; }
.overdue-tag { color: #A32D2D; font-size: 11px; font-weight: 500; }
.row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid #e5e5e0; border-radius: 10px; cursor: pointer; margin-bottom: 7px; background: #fff; transition: all 0.12s; }
.row:hover { border-color: #0F6E56; background: #f8fffc; }
.row.overdue { border-color: #F09595; background: #FCEBEB; }
.row.warning { border-color: #F5C842; background: #FFFBEA; }
.status-btns { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0; }
.status-btn { padding: 3px 10px; border-radius: 7px; font-size: 11px; font-weight: 500; cursor: pointer; border: 1px solid; }
.divider { height: 1px; background: #e5e5e0; margin: 14px 0; }
.section-title { font-size: 12px; font-weight: 500; color: #444; margin-bottom: 8px; }
.alert-info { background: #E6F1FB; border: 1px solid #B5D4F4; color: #0C447C; padding: 9px 13px; border-radius: 8px; font-size: 12px; margin-bottom: 12px; }
.alert-warn { background: #FFFBEA; border: 1px solid #F5C842; color: #7A5B00; padding: 9px 13px; border-radius: 8px; font-size: 12px; margin-bottom: 12px; }
.loading { text-align: center; padding: 40px; color: #aaa; font-size: 13px; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 7px; font-size: 10px; background: #f0f0eb; color: #666; border: 1px solid #e5e5e0; margin: 1px; }
.doc-row { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border: 1px solid #e5e5e0; border-radius: 8px; background: #fff; margin-bottom: 5px; }
.pdf-icon { width: 30px; height: 30px; border-radius: 6px; background: #FCEBEB; border: 1px solid #F7C1C1; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #791F1F; flex-shrink: 0; }
.tpl-box { background: #f8f8f5; border: 1px solid #e5e5e0; border-radius: 9px; padding: 13px 15px; font-size: 11px; line-height: 1.8; white-space: pre-wrap; font-family: monospace; color: #1a1a1a; }
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.filter-bar select, .filter-bar input[type=text], .filter-bar input[type=date] { width: auto; font-size: 12px; padding: 6px 10px; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
.modal-overlay.open { display: flex; }
.modal-box { background: #fff; border-radius: 14px; width: 100%; max-width: 600px; max-height: 88vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
.modal-box.sm { max-width: 440px; }
.modal-box.lg { max-width: 720px; }
.modal-hd { display: flex; justify-content: space-between; align-items: flex-start; padding: 18px 20px 12px; position: sticky; top: 0; background: #fff; border-bottom: 1px solid #e5e5e0; border-radius: 14px 14px 0 0; z-index: 1; }
.modal-bd { padding: 16px 20px 20px; }
.modal-close { background: none; border: none; font-size: 20px; color: #aaa; cursor: pointer; padding: 0; flex-shrink: 0; line-height: 1; }
/* 產品選擇 dropdown */
.product-picker { position: relative; }
.product-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #e5e5e0; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); z-index: 100; max-height: 220px; overflow-y: auto; display: none; }
.product-dropdown.open { display: block; }
.product-option { padding: 9px 12px; font-size: 12px; cursor: pointer; border-bottom: 1px solid #f0f0eb; }
.product-option:hover { background: #f8fffc; }
.product-option:last-child { border-bottom: none; }
.product-option .po-name { font-weight: 500; color: #1a1a1a; }
.product-option .po-meta { font-size: 10px; color: #aaa; margin-top: 1px; }
@media (max-width: 680px) { .sidebar { width: 48px; } .sidebar-logo p, .nav-item span, .nav-section, .sidebar-footer { display: none; } .content { padding: 14px; } .grid-2 { grid-template-columns: 1fr; } .grid-3 { grid-template-columns: 1fr; } }
#toast-container { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 999; display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
.toast { padding: 10px 14px; border-radius: 9px; font-size: 12px; line-height: 1.5; box-shadow: 0 4px 16px rgba(0,0,0,0.12); display: flex; align-items: flex-start; gap: 10px; animation: toast-in 0.18s ease; }
.toast-success { background: #E1F5EE; color: #085041; border: 1px solid #0F6E56; }
.toast-error { background: #FCEBEB; color: #791F1F; border: 1px solid #F09595; }
.toast-close { background: none; border: none; cursor: pointer; font-size: 16px; color: inherit; opacity: 0.6; padding: 0; flex-shrink: 0; line-height: 1; }
@keyframes toast-in { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-logo">
    <h1>JOY CHIN PSA</h1>
    <p>離型紙業務系統</p>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">業務</div>
    <button class="nav-item active" id="nav-inquiry" onclick="switchTab('inquiry')">
      <span class="nav-icon">📋</span><span>詢價管理</span>
    </button>
    <button class="nav-item" id="nav-quotes" onclick="switchTab('quotes')">
      <span class="nav-icon">💰</span><span>報價管理</span>
    </button>
    <button class="nav-item" id="nav-samples" onclick="switchTab('samples')">
      <span class="nav-icon">🧪</span><span>樣品管理</span>
    </button>
    <button class="nav-item" id="nav-tasks" onclick="switchTab('tasks')">
      <span class="nav-icon">✅</span><span>工作追蹤</span>
    </button>
    <div class="nav-section">通訊錄</div>
    <button class="nav-item" id="nav-customers" onclick="switchTab('customers')">
      <span class="nav-icon">👥</span><span>客戶管理</span>
    </button>
    <button class="nav-item" id="nav-suppliers_mgmt" onclick="switchTab('suppliers_mgmt')">
      <span class="nav-icon">🏭</span><span>供應商管理</span>
    </button>
    <div class="nav-section">產品</div>
    <button class="nav-item" id="nav-products" onclick="switchTab('products')">
      <span class="nav-icon">📦</span><span>產品目錄</span>
    </button>
    <button class="nav-item" id="nav-docs" onclick="switchTab('docs')">
      <span class="nav-icon">📁</span><span>技術文件庫</span>
    </button>
  </nav>
  <div class="sidebar-footer">rey@joy-paper.com</div>
</div>

<div id="toast-container"></div>
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="topbar-title">詢價管理</div>
    <div id="overdue-alert" style="display:none" class="badge"></div>
  </div>
  <div class="content">

    <!-- 詢價管理 -->
    <div id="tab-inquiry">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div id="inq-summary" style="font-size:12px;color:#888"></div>
        <button class="btn btn-primary" onclick="showNewInqForm()">+ 新增詢價</button>
      </div>
      <div class="filter-bar">
        <select id="f-status" onchange="renderInquiries()">
          <option value="">全部狀態</option>
          <option value="pending">待詢供應商</option>
          <option value="asked">已發詢價</option>
          <option value="received">供應商已回</option>
          <option value="sent_to_quote">已送報價</option>
          <option value="closed">已結案</option>
        </select>
        <select id="f-customer" onchange="renderInquiries()"><option value="">全部客戶</option></select>
        <input id="f-product" type="text" placeholder="搜尋產品..." oninput="renderInquiries()" style="max-width:150px" />
        <input id="f-date-from" type="date" onchange="renderInquiries()" style="max-width:140px" />
        <span style="font-size:11px;color:#aaa">至</span>
        <input id="f-date-to" type="date" onchange="renderInquiries()" style="max-width:140px" />
        <button class="btn btn-ghost btn-sm" onclick="clearFilters()">清除</button>
      </div>
      <div id="new-inq-form" class="card" style="display:none;border-color:#0F6E56;background:#f8fffc">
        <div class="section-title" style="color:#085041;margin-bottom:12px">新增客製化詢價</div>
        <div class="grid-2" style="margin-bottom:10px">
          <div>
            <label>客戶 <span class="req">*</span></label>
            <div style="display:flex;gap:6px">
              <select id="nf-customer" style="flex:1"><option value="">— 選擇客戶 —</option></select>
              <button class="btn btn-ghost btn-sm" onclick="switchTab('customers');hideNewInqForm()" style="white-space:nowrap">+ 新客戶</button>
            </div>
          </div>
          <div><label>供應商截止回覆日</label><input id="nf-deadline" type="date" /></div>
        </div>
        <div style="margin-bottom:10px"><label>產品需求 <span class="req">*</span></label><input id="nf-product" placeholder="例：45g 單面矽離型紙" /></div>
        <div style="margin-bottom:10px"><label>規格詳細說明</label><textarea id="nf-spec" placeholder="幅寬、克重、矽化量、表面張力..."></textarea></div>
        <div style="margin-bottom:14px"><label>供應商 <span class="req">*</span></label><select id="nf-supplier"><option value="">— 選擇供應商公司 —</option></select></div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" onclick="createInquiry()">建立詢價單</button>
          <button class="btn btn-ghost" onclick="hideNewInqForm()">取消</button>
        </div>
      </div>
      <div id="inquiry-list"></div>
    </div>

    <!-- 報價管理 -->
    <div id="tab-quotes" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div id="quote-summary" style="font-size:12px;color:#888"></div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost btn-sm" onclick="openSettingsModal()">⚙ 報價預設值</button>
          <button class="btn btn-primary" onclick="openNewQuoteModal()">+ 直接新增報價單</button>
        </div>
      </div>
      <div id="quote-list"></div>
    </div>

    <!-- 樣品管理 -->
    <div id="tab-samples" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div id="sample-summary" style="font-size:12px;color:#888"></div>
        <button class="btn btn-primary" onclick="openNewSampleModal()">+ 新增樣品</button>
      </div>
      <div class="filter-bar">
        <select id="fs-status" onchange="renderSamples()">
          <option value="">全部狀態</option>
          <option value="in_stock">庫存中</option>
          <option value="low_stock">庫存不足</option>
          <option value="out_of_stock">缺貨</option>
        </select>
        <select id="fs-supplier" onchange="renderSamples()"><option value="">全部供應商</option></select>
        <select id="fs-customer" onchange="renderSamples()"><option value="">全部客戶</option></select>
      </div>
      <div id="sample-list"></div>
    </div>

    <!-- 工作追蹤 -->
    <div id="tab-tasks" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div id="task-summary" style="font-size:12px;color:#888"></div>
        <button class="btn btn-primary" onclick="openTaskModal()">+ 新增工作</button>
      </div>
      <div class="filter-bar">
        <select id="ft-status" onchange="renderTasks()">
          <option value="">全部</option>
          <option value="open">進行中</option>
          <option value="done">已完成</option>
        </select>
        <select id="ft-priority" onchange="renderTasks()">
          <option value="">全部優先級</option>
          <option value="urgent">緊急</option>
          <option value="high">高</option>
          <option value="normal">一般</option>
        </select>
      </div>
      <div id="task-list"></div>
    </div>

    <!-- 客戶管理 -->
    <div id="tab-customers" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div id="customer-summary" style="font-size:12px;color:#888"></div>
        <button class="btn btn-primary" onclick="showNewCustomerForm()">+ 新增客戶</button>
      </div>
      <div id="new-customer-form" class="card" style="display:none;border-color:#185FA5;background:#f0f7ff">
        <div class="section-title" style="color:#0C447C;margin-bottom:12px">新增客戶</div>
        <div class="grid-2" style="margin-bottom:10px">
          <div><label>聯絡人姓名 <span class="req">*</span></label><input id="nc-name" placeholder="例：David Chen" /></div>
          <div><label>公司名稱 <span class="req">*</span></label><input id="nc-company" placeholder="例：ABC Packaging Co." /></div>
          <div><label>Email</label><input id="nc-email" placeholder="david@abc.com" /></div>
          <div><label>電話</label><input id="nc-phone" placeholder="+66 81 234 5678" /></div>
          <div><label>國家</label>
            <select id="nc-country">
              <option value="TH">泰國 TH</option><option value="TW">台灣 TW</option>
              <option value="CN">中國 CN</option><option value="SG">新加坡 SG</option>
              <option value="MY">馬來西亞 MY</option><option value="OTHER">其他</option>
            </select>
          </div>
          <div><label>行業</label><input id="nc-industry" placeholder="例：包裝、標籤" /></div>
        </div>
        <div style="margin-bottom:10px"><label>備註</label><textarea id="nc-notes" placeholder="特殊需求、偏好..."></textarea></div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-blue" onclick="createCustomer()">新增</button>
          <button class="btn btn-ghost" onclick="hideNewCustomerForm()">取消</button>
        </div>
      </div>
      <div id="customer-list"></div>
    </div>

    <!-- 供應商管理 -->
    <div id="tab-suppliers_mgmt" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div id="supplier-summary" style="font-size:12px;color:#888"></div>
        <button class="btn btn-primary" onclick="showNewSupplierForm()">+ 新增供應商</button>
      </div>
      <div id="new-supplier-form" class="card" style="display:none;border-color:#0F6E56;background:#f8fffc">
        <div class="section-title" style="color:#085041;margin-bottom:12px">新增供應商聯絡人</div>
        <div class="grid-2" style="margin-bottom:10px">
          <div><label>姓名 <span class="req">*</span></label><input id="ns-name" placeholder="例：王經理" /></div>
          <div><label>公司 <span class="req">*</span></label><input id="ns-company" placeholder="例：裕豐紙業" /></div>
          <div><label>職務</label><input id="ns-role" placeholder="例：業務經理" /></div>
          <div><label>Email <span class="req">*</span></label><input id="ns-email" placeholder="wang@yufeng.com" /></div>
          <div><label>電話</label><input id="ns-phone" placeholder="+886 2 1234 5678" /></div>
          <div><label>LINE ID</label><input id="ns-line" placeholder="wang_yufeng" /></div>
          <div><label>WhatsApp</label><input id="ns-whatsapp" placeholder="+886912345678" /></div>
          <div><label>專長產品</label><input id="ns-specialty" placeholder="矽油離型紙" /></div>
          <div><label>郵件稱謂</label><input id="ns-salutation" placeholder="例：王哥、李總、David" /></div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" onclick="createSupplier()">新增</button>
          <button class="btn btn-ghost" onclick="hideNewSupplierForm()">取消</button>
        </div>
      </div>
      <div id="supplier-mgmt-list"></div>
    </div>

    <!-- 產品目錄 -->
    <div id="tab-products" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div id="product-summary" style="font-size:12px;color:#888"></div>
        <button class="btn btn-primary" onclick="openProductModal()">+ 新增產品</button>
      </div>
      <div id="product-overdue-alert" style="display:none" class="alert-warn"></div>
      <div class="filter-bar">
        <input id="fp-search" type="text" placeholder="搜尋產品名稱、料號..." oninput="renderProducts()" style="max-width:200px" />
        <select id="fp-supplier" onchange="renderProducts()"><option value="">全部供應商</option></select>
        <select id="fp-status" onchange="renderProducts()">
          <option value="">全部狀態</option>
          <option value="ok">正常</option>
          <option value="warn">即將到期</option>
          <option value="overdue">需更新</option>
          <option value="inactive">Inactive</option>
        </select>
        <button class="btn btn-ghost btn-sm" onclick="clearProductFilters()">清除</button>
      </div>
      <div id="product-list"></div>
    </div>

    <!-- 技術文件庫 -->
    <div id="tab-docs" style="display:none">
      <div style="margin-bottom:12px"><input id="doc-search" placeholder="搜尋產品、文件類型、標籤..." oninput="renderDocs()" /></div>
      <div class="alert-info">業務助理可直接搜尋並複製連結給客戶</div>
      <div id="doc-list"></div>
      <button class="btn btn-ghost" style="width:100%;margin-top:8px;border-style:dashed" onclick="alert('上傳功能即將開放')">+ 上傳新文件</button>
    </div>

  </div>
</div>

<!-- 詢價 Modal -->
<div class="modal-overlay" id="modal-inq" onclick="closeModalOnBg(event,'modal-inq')">
  <div class="modal-box">
    <div class="modal-hd" id="modal-inq-hd"></div>
    <div class="modal-bd" id="modal-inq-bd"></div>
  </div>
</div>

<!-- 客戶編輯 Modal -->
<div class="modal-overlay" id="modal-customer" onclick="closeModalOnBg(event,'modal-customer')">
  <div class="modal-box sm">
    <div class="modal-hd" id="modal-customer-hd"></div>
    <div class="modal-bd" id="modal-customer-bd"></div>
  </div>
</div>

<!-- 供應商編輯 Modal -->
<div class="modal-overlay" id="modal-supplier" onclick="closeModalOnBg(event,'modal-supplier')">
  <div class="modal-box sm">
    <div class="modal-hd" id="modal-supplier-hd"></div>
    <div class="modal-bd" id="modal-supplier-bd"></div>
  </div>
</div>

<!-- 報價詳情 Modal -->

function showToast(msg,type='success'){
  const c=document.getElementById('toast-container')
  const t=document.createElement('div')
  t.className='toast toast-'+type
  t.innerHTML='<span style="flex:1">'+msg+'</span>'+(type==='error'?'<button class="toast-close" onclick="this.parentElement.remove()">×</button>':'')
  c.appendChild(t)
  if(type==='success')setTimeout(()=>t.remove(),3000)
}

function renderSamples(){
  const el=document.getElementById('sample-list')
  const sum=document.getElementById('sample-summary')
  if(!el)return
  // populate supplier filter
  const supSel=document.getElementById('fs-supplier')
  if(supSel&&supSel.options.length<=1){
    const cos=[...new Set(samples.map(s=>{const sup=suppliers.find(x=>x.id===s.supplier_id);return sup?.company}).filter(Boolean))].sort()
    supSel.innerHTML='<option value="">全部供應商</option>'+cos.map(c=>'<option>'+c+'</option>').join('')
  }
  const fSt=document.getElementById('fs-status')?.value||''
  const fSup=document.getElementById('fs-supplier')?.value||''
  let list=samples.filter(s=>{
    if(fSt&&s.status!==fSt)return false
    if(fSup){const sup=suppliers.find(x=>x.id===s.supplier_id);if(sup?.company!==fSup)return false}
    return true
  })
  if(sum)sum.textContent=list.length+' 筆樣品'
  if(!list.length){el.innerHTML='<div class="loading">尚無樣品資料</div>';return}
  el.innerHTML=list.map(s=>{
    const sup=suppliers.find(x=>x.id===s.supplier_id)
    const st=SAMPLE_STATUS.find(x=>x.id===s.status)||{label:s.status||'—',color:'#888',bg:'#f0f0f0'}
    const riCount=sampleRequestsIn.filter(r=>r.sample_id===s.id).length
    const soCount=sampleShipmentsOut.filter(r=>r.sample_id===s.id).length
    return '<div class="row" onclick="openSampleModal(\''+s.id+'\')">'+
      '<div style="flex:1;min-width:0">'+
      '<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:3px">'+
      '<span style="font-size:13px;font-weight:500">'+s.product_name+'</span>'+
      '<span style="font-size:11px;color:#aaa">庫存 '+(s.stock_qty??'—')+' '+(s.unit||'')+'</span>'+
      '</div>'+
      '<div style="font-size:12px;color:#666">'+(sup?sup.company:'—')+(riCount?' · 索取 '+riCount+' 筆':'')+(soCount?' · 寄出 '+soCount+' 筆':'')+'</div>'+
      '</div>'+
      '<span class="badge" style="background:'+st.bg+';color:'+st.color+';border:1px solid '+st.color+'">'+st.label+'</span>'+
      '</div>'
  }).join('')
}

function renderTasks(){
  const el=document.getElementById('task-list')
  const sum=document.getElementById('task-summary')
  if(!el)return
  const fSt=document.getElementById('ft-status')?.value||''
  const fPr=document.getElementById('ft-priority')?.value||''
  let list=tasks.filter(t=>{
    if(fSt&&t.status!==fSt)return false
    if(fPr&&t.priority!==fPr)return false
    return true
  })
  const open=list.filter(t=>t.status==='open')
  const done=list.filter(t=>t.status==='done')
  if(sum)sum.textContent=open.length+' 筆進行中 / 共 '+list.length+' 筆'
  if(!list.length){el.innerHTML='<div class="loading">尚無工作項目</div>';return}
  const today=new Date().toISOString().slice(0,10)
  const taskRow=t=>{
    const pr=PRIORITY_STATUS.find(x=>x.id===t.priority)||PRIORITY_STATUS[0]
    const overdue=t.due_date&&t.due_date<today&&t.status==='open'
    return '<div class="row '+(overdue?'overdue':'')+'" style="cursor:default">'+
      '<div style="flex:1;min-width:0">'+
      '<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:3px">'+
      '<span style="font-size:13px;font-weight:500'+(t.status==='done'?';text-decoration:line-through;color:#aaa':'')+'">'+t.title+'</span>'+
      '<span class="badge" style="background:'+pr.bg+';color:'+pr.color+';border:1px solid '+pr.color+'">'+pr.label+'</span>'+
      '</div>'+
      '<div style="font-size:11px;color:'+(overdue?'#A32D2D':'#aaa')+'">'+
      (t.due_date?'到期 '+t.due_date+' '+(overdue?'⚠ 已逾期':''):'無到期日')+
      (t.ref_module?' · '+t.ref_module+(t.ref_id?' #'+t.ref_id:''):'')+
      '</div></div>'+
      '<div style="display:flex;gap:6px;flex-shrink:0">'+
      (t.status==='open'?'<button class="btn btn-ghost btn-sm" style="color:#3B6D11" onclick="completeTask(\''+t.id+'\')">✓ 完成</button>':'')+
      '<button class="btn btn-ghost btn-sm" style="color:#aaa" onclick="deleteTask(\''+t.id+'\')">×</button>'+
      '</div></div>'
  }
  let html=open.map(taskRow).join('')
  if(done.length)html+='<div style="font-size:11px;color:#aaa;margin:12px 0 6px">已完成（'+done.length+'）</div>'+done.map(taskRow).join('')
  el.innerHTML=html
}

async function submitTask(){
  const title=document.getElementById('tk-title')?.value.trim()
  if(!title){showToast('請填寫工作標題','error');return}
  const{error}=await sb.from('tasks').insert({
    title,
    ref_module:document.getElementById('tk-module')?.value||null,
    ref_id:document.getElementById('tk-ref-id')?.value.trim()||null,
    supplier:document.getElementById('tk-supplier')?.value||null,
    customer:document.getElementById('tk-customer')?.value||null,
    due_date:document.getElementById('tk-due')?.value||null,
    priority:document.getElementById('tk-priority')?.value||'normal',
    notes:document.getElementById('tk-notes')?.value.trim()||null,
    status:'open'
  })
  if(error){showToast('新增失敗：'+error.message,'error');return}
  await loadTasks();closeModal('modal-task');renderTasks();showToast('工作已新增')
}

async function completeTask(id){
  const{error}=await sb.from('tasks').update({status:'done'}).eq('id',id)
  if(error){showToast('更新失敗：'+error.message,'error');return}
  await loadTasks();renderTasks()
}

async function deleteTask(id){
  if(!confirm('確定要刪除這筆工作嗎？'))return
  const{error}=await sb.from('tasks').delete().eq('id',id)
  if(error){showToast('刪除失敗：'+error.message,'error');return}
  await loadTasks();renderTasks()
}

async function autoScanTasks(){
  await loadTasks()
  const today=new Date()
  const daysDiff=(dateStr)=>Math.floor((today-new Date(dateStr))/(1000*60*60*24))
  const hasOpen=(module,refId)=>tasks.some(t=>t.status==='open'&&t.ref_module===module&&t.ref_id===refId)
  const toCreate=[]
  // 詢價超過 3 天未更新
  inquiries.filter(i=>['pending','asked'].includes(i.status)&&i.updated_at&&daysDiff(i.updated_at)>=3).forEach(i=>{
    if(!hasOpen('inquiry',i.id))toCreate.push({title:'追蹤供應商回覆 - '+i.customer,ref_module:'inquiry',ref_id:i.id,priority:'normal',status:'open'})
  })
  // 索取樣品超過 7 天未到貨
  sampleRequestsIn.filter(r=>r.status==='pending'&&r.requested_date&&daysDiff(r.requested_date)>=7).forEach(r=>{
    if(!hasOpen('sample',String(r.id)))toCreate.push({title:'追蹤樣品到貨 #'+r.id,ref_module:'sample',ref_id:String(r.id),priority:'normal',status:'open'})
  })
  // 寄出樣品超過 14 天未回饋
  sampleShipmentsOut.filter(r=>r.status==='shipped'&&r.shipped_date&&daysDiff(r.shipped_date)>=14).forEach(r=>{
    if(!hasOpen('sample',String(r.id)))toCreate.push({title:'追蹤客戶樣品回饋 #'+r.id,ref_module:'sample',ref_id:String(r.id),priority:'normal',status:'open'})
  })
  if(!toCreate.length)return
  const{error}=await sb.from('tasks').insert(toCreate)
  if(error){showToast('自動建立工作單失敗：'+error.message,'error');return}
  await loadTasks()
}

function updateOverdueAlert(){
  const n=inquiries.filter(i=>isOverdue(i)&&!['sent_to_quote','closed'].includes(i.status)).length
  const el=document.getElementById('overdue-alert')
  if(n>0){el.style.display='inline-block';el.setAttribute('style','display:inline-block;background:#FCEBEB;color:#A32D2D;border:1px solid #F09595;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:500');el.textContent='⚠ '+n+' 筆超時'}
  else el.style.display='none'
}
function updateProductOverdueAlert(){
  const now=new Date()
  const overdue=products.filter(p=>productStatus(p)==='overdue').length
  const warn=products.filter(p=>productStatus(p)==='warn').length
  const el=document.getElementById('product-overdue-alert')
  if(!el)return
  if(overdue>0||warn>0){
    el.style.display='block'
    el.textContent=(overdue?'⚠ '+overdue+' 個產品成本需要更新  ':'')+( warn?' 🕐 '+warn+' 個即將到期':'')
  } else {
    el.style.display='none'
  }
}
function productStatus(p){
  if(!p.last_reviewed_at||!p.review_days)return 'ok'
  const last=new Date(p.last_reviewed_at)
  const daysSince=Math.floor((new Date()-last)/(1000*60*60*24))
  if(daysSince>=p.review_days)return 'overdue'
  if(daysSince>=p.review_days*0.8)return 'warn'
  return 'ok'
}
function productDaysLeft(p){
  if(!p.last_reviewed_at||!p.review_days)return null
  const last=new Date(p.last_reviewed_at)
  const daysSince=Math.floor((new Date()-last)/(1000*60*60*24))
  return p.review_days-daysSince
}

function renderInquiries(){
  const fS=document.getElementById('f-status')?.value||''
  const fC=document.getElementById('f-customer')?.value||''
  const fP=(document.getElementById('f-product')?.value||'').toLowerCase()
  const fF=document.getElementById('f-date-from')?.value||''
  const fT=document.getElementById('f-date-to')?.value||''
  let list=inquiries.filter(i=>{
    if(fS&&i.status!==fS)return false
    if(fC&&i.customer!==fC)return false
    if(fP&&!i.product?.toLowerCase().includes(fP))return false
    if(fF&&i.created_at<fF)return false
    if(fT&&i.created_at.slice(0,10)>fT)return false
    return true
  })
  const active=list.filter(i=>i.status!=='closed')
  const closed=list.filter(i=>i.status==='closed')
  document.getElementById('inq-summary').textContent=active.length+' 筆進行中 / 共 '+list.length+' 筆'
  let html=active.map(i=>inqRowHtml(i)).join('')

function qItemChange(id,field,value){
  if(!_qPendingItems[id])_qPendingItems[id]={}
  _qPendingItems[id][field]=value
  const it=quoteItems.find(x=>x.id===id);if(it)it[field]=value
  renderQuoteModalBd()
}
function qHeaderChange(field,value){
  _qPendingHeader[field]=value
  const h=quoteHeaders.find(x=>x.id===selectedQuoteId);if(h)h[field]=value
}
function qStatusChange(status){
  _qPendingHeader.status=status
  const h=quoteHeaders.find(x=>x.id===selectedQuoteId);if(h)h.status=status
  renderQuoteModalBd()
}

function filterQiProducts(){
  const supFilter=document.getElementById('qi-sup')?.value||''
  const prodSel=document.getElementById('qi-prod')
  if(!prodSel)return
  const filtered=supFilter?products.filter(p=>{const s=suppliers.find(x=>x.id===p.supplier_id);return s?.company===supFilter}):products
  prodSel.innerHTML='<option value="">— 選擇產品 —</option>'+
    filtered.map(p=>{const ps=suppliers.find(s=>s.id===p.supplier_id);return '<option value="'+p.id+'">'+(ps?'['+ps.company+'] ':'')+p.product_name+'</option>'}).join('')
}

async function addQuoteItem(){
  const prodId=document.getElementById('qi-prod')?.value
  if(!prodId){showToast('請選擇產品','error');return}
  const p=products.find(x=>String(x.id)===String(prodId))
  if(!p)return
  const{error}=await sb.from('quote_items').insert({
    header_id:selectedQuoteId,product:p.product_name,spec:p.spec||null,
    product_id:p.id,supplier_id:p.supplier_id||null,
    customs_fee_pct:parseFloat(settings.default_customs_fee_pct||7.5),
    apply_customs:true,margin_pct:parseFloat(settings.default_margin_pct||20)
  })
  if(error){showToast('新增品項失敗：'+error.message,'error');return}
  await loadQuotes()
  await syncHeaderSupplier()
  renderQuoteModalHd();renderQuoteModalBd()
  showToast('品項已加入')
}

async function syncHeaderSupplier(){
  const items=quoteItems.filter(it=>it.header_id===selectedQuoteId)
  if(!items.length)return
  const sids=[...new Set(items.map(it=>it.supplier_id).filter(Boolean))]
  if(sids.length!==1)return
  const sup=suppliers.find(s=>s.id===sids[0])
  if(!sup)return
  const h=quoteHeaders.find(x=>x.id===selectedQuoteId)
  if(h&&h.supplier!==sup.company){
    await sb.from('quote_headers').update({supplier:sup.company}).eq('id',selectedQuoteId)
    h.supplier=sup.company
  }
}

async function removeQuoteItem(id){
  const{error}=await sb.from('quote_items').delete().eq('id',id)
  if(error){showToast('移除失敗：'+error.message,'error');return}
  await loadQuotes()
  renderQuoteModalBd()
}

async function qSaveAndStatus(status){
  qStatusChange(status)
  await saveQuote()
}

async function saveQuote(){
  if(Object.keys(_qPendingHeader).length){
    const{error}=await sb.from('quote_headers').update(_qPendingHeader).eq('id',selectedQuoteId)
    if(error){showToast('儲存失敗：'+error.message,'error');return}
  }
  const results=await Promise.all(Object.entries(_qPendingItems).map(([id,changes])=>sb.from('quote_items').update(changes).eq('id',id)))
  const fail=results.find(r=>r.error)
  if(fail){showToast('品項儲存失敗：'+fail.error.message,'error');return}
  _qPendingItems={};_qPendingHeader={}
  await loadQuotes();renderQuotes();renderQuoteModalHd();renderQuoteModalBd()
  showToast('報價已儲存')
}

async function newQuoteVersion(){
  const h=quoteHeaders.find(x=>x.id===selectedQuoteId);if(!h)return
  const items=quoteItems.filter(it=>it.header_id===h.id)
  const newV=h.version+1
  const newId=h.id.replace(/-v\d+$/,'')+'-v'+newV
  const{error}=await sb.from('quote_headers').insert({
    id:newId,inquiry_id:h.inquiry_id||null,customer:h.customer,supplier:h.supplier,version:newV,status:'draft',notes:h.notes,source:h.source||null
  })
  if(error){showToast('建立新版本失敗：'+error.message,'error');return}
  if(items.length){
    const newItems=items.map(({id:_,...rest})=>({...rest,header_id:newId}))
    const{error:e2}=await sb.from('quote_items').insert(newItems)
    if(e2){showToast('品項複製失敗：'+e2.message,'error');return}
  }
  await loadQuotes();selectedQuoteId=newId;_qPendingItems={};_qPendingHeader={}
  renderQuotes();renderQuoteModalHd();renderQuoteModalBd()
  showToast('新版本 v'+newV+' 已建立')
}

    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'+
    '<div style="font-size:12px;font-weight:500;color:#444">品項 '+(idx+1)+(it.from_catalog?'<span style="margin-left:6px;font-size:10px;color:#0F6E56;background:#E1F5EE;padding:1px 6px;border-radius:5px">目錄</span>':'')+'</div>'+

    '</div>'+
    '<div class="grid-2" style="margin-bottom:8px">'+

    '<div><label>成本價</label><input type="number" value="'+(it.cost_price||'')+'" placeholder="0.00" step="0.01" onchange="updateNqField('+idx+',\'cost_price\',parseFloat(this.value)||0);refreshNqCalc('+idx+')" /></div>'+
    '<div><label>幣別</label><select onchange="updateNqField('+idx+',\'cost_currency\',this.value)">'+['USD','THB','TWD','CNY','EUR'].map(c=>'<option '+(it.cost_currency===c?'selected':'')+'>'+c+'</option>').join('')+'</select></div>'+
    '<div><label style="display:flex;justify-content:space-between"><span>清關費 %</span>'+
    '<label style="display:inline-flex;align-items:center;gap:3px;font-size:10px;cursor:pointer">'+

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function updateNqField(idx,field,value){
  _nqItems[idx][field]=value
}

function refreshNqCalc(idx){
  const it=_nqItems[idx]
  const cp=parseFloat(it.cost_price||0)
  const cus=it.apply_customs!==false?(cp*(parseFloat(it.customs_fee_pct||0)/100)):0
  const base=cp+cus
  const final=base*(1+(parseFloat(it.margin_pct||0)/100))
  const cur=it.cost_currency||'USD'
  const hasP=cp>0
  const el=document.getElementById('nq-calc-'+idx)
  if(!el)return
  el.style.background=hasP?'#E1F5EE':'#f8f8f5'
  el.style.borderColor=hasP?'#0F6E56':'#e5e5e0'
  el.style.color=hasP?'#0F6E56':'#aaa'
  el.innerHTML=hasP?'<strong>'+final.toFixed(2)+' '+cur+'</strong><span style="font-size:10px;margin-left:8px">成本 '+cp.toFixed(2)+' + 清關 '+cus.toFixed(2)+' + 利潤 '+(final-base).toFixed(2)+'</span>':'請填入成本價以計算報價'
}

  if(!filtered.length){list.innerHTML='<div style="padding:30px;text-align:center;color:#aaa;font-size:12px">找不到符合產品</div>';return}
  list.innerHTML=filtered.map(p=>{
    const st=productStatus(p)
    const sup=suppliers.find(s=>s.id===p.supplier_id)

    return '<div onclick="pickCatalogProduct('+p.id+')" style="padding:10px 14px;border-bottom:1px solid #f0f0eb;cursor:pointer;transition:background 0.1s" onmouseover="this.style.background=\'#f8fffc\'" onmouseout="this.style.background=\'\'">'+

      '<div style="font-size:11px;color:#aaa;margin-top:1px">'+(sup?sup.company:'—')+' · '+(p.cost_price?p.cost_price+' '+p.currency:'成本未填')+(p.unit?' / '+p.unit:'')+'</div>'+

function pickCatalogProduct(productId){

  _nqItems.push({

    customs_fee_pct:parseFloat(settings.default_customs_fee_pct||7.5),
    apply_customs:true,

function syncNqSupplier(){
  const el=document.getElementById('nq-supplier')
  if(!el)return
  const withProduct=_nqItems.filter(it=>it.from_product_id)
  if(!withProduct.length){el.value='';return}
  const sids=[...new Set(withProduct.map(it=>{
    const p=products.find(x=>x.id===it.from_product_id)
    return p?.supplier_id??null
  }).filter(x=>x!==null))]
  if(sids.length===0){el.value='';return}
  if(sids.length===1){
    const sup=suppliers.find(s=>s.id===sids[0])
    el.value=sup?sup.company:''
  } else {
    el.value='（多家供應商）'
  }
}

async function submitNewQuote(){
  const customer=document.getElementById('nq-customer')?.value
  if(!customer){showToast('請選擇客戶','error');return}
  if(!_nqItems.length){showToast('請至少新增一個品項','error');return}
  const hasEmpty=_nqItems.some(it=>!it.product?.trim())
  if(hasEmpty){showToast('有品項未填產品名稱','error');return}
  const supplier=document.getElementById('nq-supplier')?.value||null
  const notes=document.getElementById('nq-notes')?.value||null
  // 產生 ID
  const now=new Date()
  const yy=now.getFullYear()
  const mm=String(now.getMonth()+1).padStart(2,'0')
  const dd=String(now.getDate()).padStart(2,'0')
  const seq=String(quoteHeaders.length+1).padStart(3,'0')
  const hId='QUO-D-'+yy+mm+dd+'-'+seq+'-v1'
  const{error}=await sb.from('quote_headers').insert({
    id:hId,inquiry_id:null,customer,supplier,version:1,status:'draft',notes,source:'direct'
  })
  if(error){showToast('建立失敗：'+error.message,'error');return}
  const itemsToInsert=_nqItems.map(it=>({
    header_id:hId,
    product:it.product,
    spec:it.spec||null,
    cost_price:parseFloat(it.cost_price)||null,
    cost_currency:it.cost_currency||'USD',
    customs_fee_pct:parseFloat(it.customs_fee_pct||7.5),
    apply_customs:it.apply_customs!==false,
    margin_pct:parseFloat(it.margin_pct||20),
    moq:it.moq||null,
    lead_time:it.lead_time||null
  }))
  const{error:e2}=await sb.from('quote_items').insert(itemsToInsert)
  if(e2){showToast('品項建立失敗：'+e2.message,'error');return}
  await loadQuotes();closeModal('modal-new-quote');renderQuotes()
  showToast('報價單 '+hId+' 已建立')
  // 開啟剛建立的報價
  setTimeout(()=>openQuoteModal(hId),300)
}

  renderProducts()

function renderProducts(){
  const el=document.getElementById('product-list')
  const sum=document.getElementById('product-summary')
  if(!el)return
  const q=(document.getElementById('fp-search')?.value||'').toLowerCase()
  const fSup=document.getElementById('fp-supplier')?.value||''
  const fStatus=document.getElementById('fp-status')?.value||''
  let list=products.filter(p=>{
    if(q&&!p.product_name.toLowerCase().includes(q)&&!(p.product_code||'').toLowerCase().includes(q))return false
    if(fSup){const s=suppliers.find(x=>x.id===p.supplier_id);if(!s||s.company!==fSup)return false}
    if(fStatus==='inactive'){return p.is_active===false}
    if(fStatus){const st=productStatus(p);if(p.is_active===false||st!==fStatus)return false}
    return true
  })
  if(sum)sum.textContent=list.length+' 個產品'
  if(!list.length){el.innerHTML='<div class="loading">尚無產品，點「新增產品」開始建立目錄</div>';return}
  el.innerHTML=list.map(p=>{
    const st=productStatus(p)
    const daysLeft=productDaysLeft(p)
    const sup=suppliers.find(s=>s.id===p.supplier_id)
    const stColor=st==='overdue'?'#A32D2D':st==='warn'?'#7A5B00':'#3B6D11'
    const stBg=st==='overdue'?'#FCEBEB':st==='warn'?'#FFFBEA':'#EAF3DE'
    const stLabel=st==='overdue'?'需更新':st==='warn'?'即將到期':'正常'
    const isActive=p.is_active!==false
    return '<div class="row '+(st==='overdue'?'overdue':st==='warn'?'warning':'')+'" style="'+(isActive?'':'opacity:0.5')+'" onclick="openProductModal('+p.id+')">'+
      '<div style="flex:1;min-width:0">'+
      '<div style="display:flex;align-items:center;gap:7px;margin-bottom:3px;flex-wrap:wrap">'+
      (p.product_code?'<span style="font-size:10px;color:#aaa;font-family:monospace">'+p.product_code+'</span>':'')+
      '<span style="font-size:13px;font-weight:500">'+p.product_name+'</span>'+
      '<span class="badge" style="background:'+stBg+';color:'+stColor+';border:1px solid '+stColor+'">'+stLabel+'</span>'+
      (!isActive?'<span class="badge" style="background:#f0f0eb;color:#888;border:1px solid #ccc">Inactive</span>':'')+
      '</div>'+
      '<div style="font-size:12px;color:#666">'+(sup?sup.company:'—')+(p.cost_price?' · 成本 '+p.cost_price+' '+(p.currency||'')+(p.unit?' / '+p.unit:''):'')+'</div>'+
      '<div style="font-size:11px;color:#aaa">上次確認：'+(p.last_reviewed_at||'—')+(daysLeft!==null?' · '+(daysLeft>0?'剩 '+daysLeft+' 天':'已過 '+Math.abs(daysLeft)+' 天'):'')+(p.review_days?' （'+p.review_days+'天週期）':'')+'</div>'+
      '</div>'+
      '<div style="display:flex;gap:6px;flex-shrink:0">'+
      '<button class="btn btn-ghost btn-sm" style="white-space:nowrap" onclick="event.stopPropagation();confirmReview('+p.id+')">✓ 已確認</button>'+
      '</div>'+
      '</div>'
  }).join('')
}

async function saveProduct(id){
  const name=document.getElementById('pd-name').value.trim()
  if(!name){showToast('請填寫產品名稱','error');return}
  const data={
    product_name:name,
    product_code:document.getElementById('pd-code').value.trim()||null,
    supplier_id:parseInt(document.getElementById('pd-supplier').value)||null,
    unit:document.getElementById('pd-unit').value.trim()||null,
    cost_price:parseFloat(document.getElementById('pd-cost').value)||null,
    currency:document.getElementById('pd-currency').value,
    review_days:parseInt(document.getElementById('pd-days').value)||90,
    last_reviewed_at:document.getElementById('pd-reviewed').value||null,
    notes:document.getElementById('pd-notes').value.trim()||null,
    is_active:document.getElementById('pd-active').value==='true'
  }
  let error
  if(id){({error}=await sb.from('products').update(data).eq('id',id))}
  else{({error}=await sb.from('products').insert(data))}
  if(error){showToast('儲存失敗：'+error.message,'error');return}
  await loadProducts();closeModal('modal-product')
  populateProductSupplierFilter();renderProducts();updateProductOverdueAlert()
  showToast(id?'產品已更新':'產品已新增')
}

async function deleteProduct(id,name){
  if(!confirm('確定要刪除「'+name+'」嗎？'))return
  const{error}=await sb.from('products').delete().eq('id',id)
  if(error){showToast('刪除失敗：'+error.message,'error');return}
  await loadProducts();closeModal('modal-product')
  populateProductSupplierFilter();renderProducts();updateProductOverdueAlert()
  showToast('已刪除')
}

// ===== 供應商管理 =====
function renderSupplierMgmt(){
  const el=document.getElementById('supplier-mgmt-list')
  const sum=document.getElementById('supplier-summary')
  if(!el)return
  if(sum)sum.textContent=suppliers.length+' 位供應商聯絡人'
  if(!suppliers.length){el.innerHTML='<div class="loading">尚無供應商資料</div>';return}
  const cos={}
  suppliers.forEach(s=>{if(!cos[s.company])cos[s.company]=[];cos[s.company].push(s)})
  el.innerHTML=Object.entries(cos).map(([company,people])=>
    '<div class="card" style="margin-bottom:10px">'+
    '<div style="font-size:13px;font-weight:500;color:#085041;margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid #e5e5e0">'+company+'</div>'+
    people.map(s=>'<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f5f5f0">'+
      '<div style="flex:1;min-width:0">'+
      '<div style="font-size:12px;font-weight:500;color:#333">'+s.name+(s.role?' <span style="font-size:10px;color:#aaa;font-weight:400">· '+s.role+'</span>':'')+'</div>'+
      '<div style="font-size:11px;color:#aaa;margin-top:1px">'+[s.email,s.phone,s.specialty].filter(Boolean).join(' · ')+'</div>'+
      '</div>'+
      '<button class="btn btn-ghost btn-sm" onclick="openEditSupplier('+s.id+')">編輯</button>'+
      '<button style="background:none;border:none;color:#ccc;cursor:pointer;font-size:16px;padding:0" onclick="deleteSupplier('+s.id+',\''+s.name+'\')">×</button>'+
      '</div>').join('')+
    '</div>').join('')
}

// ===== 技術文件庫 =====
function renderDocs(){
  const q=(document.getElementById('doc-search')?.value||'').toLowerCase()
  const filtered=documents.filter(d=>!q||d.product?.toLowerCase().includes(q)||d.doc_type?.toLowerCase().includes(q)||(d.tags||[]).some(t=>t.toLowerCase().includes(q)))
  const prods=[...new Set(filtered.map(d=>d.product))]
  let html=''
  if(!prods.length)html='<div class="loading">找不到相關文件</div>'
  prods.forEach(p=>{
    html+='<div style="font-size:12px;font-weight:500;color:#666;margin:14px 0 6px;padding-bottom:5px;border-bottom:1px solid #e5e5e0">'+p+'</div>'
    filtered.filter(d=>d.product===p).forEach(doc=>{
      html+='<div class="doc-row"><div class="pdf-icon">PDF</div>'+
        '<div style="flex:1"><div style="font-size:12px;font-weight:500">'+doc.doc_type+'</div><div style="font-size:10px;color:#aaa">'+(doc.file_size||'')+'</div></div>'+
        '<div>'+(doc.tags||[]).map(t=>'<span class="tag">'+t+'</span>').join('')+'</div>'+
        '<button class="btn btn-ghost btn-sm" onclick="copyDocLink(\''+(doc.file_url||'#')+'\',\''+doc.doc_type+'\')">複製連結</button></div>'
    })
  })
  document.getElementById('doc-list').innerHTML=html
}

function copyDocLink(url,name){navigator.clipboard.writeText(url).then(()=>alert('已複製：'+name+' 的連結')).catch(()=>alert('請手動複製'))}
