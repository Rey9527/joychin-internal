let _oiPending={}
function _calcOiItemAmt(i,pendingQty){
  const cpu=i.customer_pricing_unit
  const pendingWmM=_oiPending[i.id]?.width_m
  const wm=pendingWmM!=null?pendingWmM:parseFloat(i.width_m||0)
  const up=parseFloat(i.unit_price||0)
  const q=pendingQty!=null?pendingQty:parseFloat(i.qty||0)
  return cpu==='m2'&&wm>0?up*wm*q:up*q
}
function _fmtOiCalcStr(i,pendingQty){
  const o=orders.find(x=>x.id===selectedOrderId)
  const cpu=i.customer_pricing_unit
  const pendingWmM=_oiPending[i.id]?.width_m
  const wm=pendingWmM!=null?pendingWmM:parseFloat(i.width_m||0)
  const up=parseFloat(i.unit_price||0)
  const q=pendingQty!=null?pendingQty:parseFloat(i.qty||0)
  const cur=i.currency||(o?.currency||'')
  const unit=(_oiPending[i.id]?.unit!=null?_oiPending[i.id].unit:i.unit)||''
  const amt=_calcOiItemAmt(i,pendingQty)
  if(cpu==='m2'&&wm>0) return parseFloat(up).toFixed(2)+' '+cur+'/m² × '+wm.toFixed(4).replace(/\.?0+$/,'')+'m × '+q+unit+' = <strong>'+amt.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+cur+'</strong>'
  if(cpu==='m') return parseFloat(up).toFixed(2)+' '+cur+'/m × '+q+unit+' = <strong>'+amt.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+cur+'</strong>'
  return parseFloat(up).toFixed(2)+' '+cur+' × '+q+(unit?' '+unit:'')+' = <strong>'+amt.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+cur+'</strong>'
}

function daysFromNow(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}

function inquiryPendingDays(i){
  if(!['pending','asked'].includes(i?.status))return 0
  const base=i?.updated_at||i?.created_at
  if(!base)return 0
  return Math.floor((new Date()-new Date(base))/(1000*60*60*24))
}
function inquiryFollowupLevel(i){
  if(!['pending','asked'].includes(i?.status))return 'ok'
  const days=inquiryPendingDays(i)
  if(days>=getInquiryOverdueDays())return 'overdue'
  if(days>=getInquiryWarnDays())return 'warn'
  return 'ok'
}

function productStatus(p){
  const reviewDays=getProductReviewDays()
  if(!p.last_reviewed_at||!reviewDays)return 'ok'
  const last=new Date(p.last_reviewed_at)
  const daysSince=Math.floor((new Date()-last)/(1000*60*60*24))
  if(daysSince>=reviewDays)return 'overdue'
  if(daysSince>=reviewDays*0.8)return 'warn'
  return 'ok'
}
function productDaysLeft(p){
  const reviewDays=getProductReviewDays()
  if(!p.last_reviewed_at||!reviewDays)return null
  const last=new Date(p.last_reviewed_at)
  const daysSince=Math.floor((new Date()-last)/(1000*60*60*24))
  return reviewDays-daysSince
}

  return ''

      actionBtns+='<button class="btn btn-primary btn-sm" onclick="updatePurchaseStatus(\'sent\')">標記為已發給供應商 →</button>'
    }else if(st==='sent'){
      actionBtns+='<button class="btn btn-primary btn-sm" onclick="updatePurchaseStatus(\'in_production\')">標記生產中 →</button>'
    }else if(st==='received'){
      actionBtns+='<button class="btn btn-primary btn-sm" onclick="updatePurchaseStatus(\'completed\')">標記完成 ✓</button>'
    }
    if(!['cancelled','completed'].includes(st)){

function fillPurchaseItemFromProduct(pid){
  pid=parseInt(pid)||null
  if(!pid)return
  const p=products.find(x=>x.id===pid);if(!p)return
  const nameEl=document.getElementById('poi-name');if(nameEl)nameEl.value=p.product_name||''
  const productIdEl=document.getElementById('poi-product-id');if(productIdEl)productIdEl.value=String(p.id)
  const unitEl=document.getElementById('poi-unit');if(unitEl&&!unitEl.value)unitEl.value=p.unit||''
  const wEl=document.getElementById('poi-width-mm');if(wEl)wEl.value=p.width_m!=null?Math.round(p.width_m*1000):''
  const puEl=document.getElementById('poi-pricing-unit');if(puEl)puEl.value=p.pricing_unit||''
}
function openPurchaseProductPicker(){
  const rows=products.filter(p=>p.is_active!==false).map(p=>{
    const sup=suppliers.find(s=>s.id===p.supplier_id)
    const widthInfo=p.width_m?'· 寬 '+Math.round(p.width_m*1000)+'mm':null
    return '<div class="row" style="cursor:pointer" onclick="selectPurchaseProduct('+p.id+')">'+
      '<div style="flex:1"><div style="font-size:13px;font-weight:500">'+escapeHtml(p.product_name)+'</div>'+
      '<div style="font-size:11px;color:#888">'+[sup?.company,p.cost_price?parseFloat(p.cost_price).toFixed(2)+' '+(p.currency||''):null,widthInfo].filter(Boolean).join(' · ')+'</div></div></div>'
  }).join('')||'<div class="loading">目前沒有可選產品</div>'
  openSubformModal('選擇產品目錄',
    '<div style="margin-bottom:10px"><input id="purchase-product-search" placeholder="搜尋產品名稱" oninput="filterPurchaseProductPicker(this.value)" /></div>'+
    '<div id="purchase-product-picker">'+rows+'</div>'
  )
}
function filterPurchaseProductPicker(keyword){
  const lower=(keyword||'').trim().toLowerCase()
  const rows=products.filter(p=>p.is_active!==false&&(!lower||p.product_name?.toLowerCase().includes(lower))).map(p=>{
    const sup=suppliers.find(s=>s.id===p.supplier_id)
    const widthInfo=p.width_m?'· 寬 '+Math.round(p.width_m*1000)+'mm':null
    return '<div class="row" style="cursor:pointer" onclick="selectPurchaseProduct('+p.id+')">'+
      '<div style="flex:1"><div style="font-size:13px;font-weight:500">'+escapeHtml(p.product_name)+'</div>'+
      '<div style="font-size:11px;color:#888">'+[sup?.company,p.cost_price?parseFloat(p.cost_price).toFixed(2)+' '+(p.currency||''):null,widthInfo].filter(Boolean).join(' · ')+'</div></div></div>'
  }).join('')||'<div class="loading">沒有符合條件的產品</div>'
  document.getElementById('purchase-product-picker').innerHTML=rows
}
function selectPurchaseProduct(pid){
  fillPurchaseItemFromProduct(pid)
  closeModal('modal-subform')
}

function assignIfPresent(target,key,value){
  if(value===undefined||value===null||value==='')return
  target[key]=value
}

async function createPurchaseOrder(){
  const linkedOrderId=null
  const source='stock'
  const supplierId=parseInt(document.getElementById('pp-supplier')?.value||'',10)||null
  if(!supplierId){showToast('請填寫必要欄位','error');return}
  if(!window._pendingPurchaseItems||!window._pendingPurchaseItems.length){
    showToast('請先新增至少 1 筆產品品項，再建立採購單','error')
    return
  }
  const id=generatePurchaseId()
  const status='draft'
  const payload={id,source,supplier_id:supplierId,status}
  payload.customer_order_id=linkedOrderId
  assignIfPresent(payload,'accounting_no',document.getElementById('pp-accounting')?.value?.trim())
  assignIfPresent(payload,'expected_delivery',document.getElementById('pp-expected')?.value)
  assignIfPresent(payload,'currency',document.getElementById('pp-currency')?.value||'USD')
  assignIfPresent(payload,'notes',document.getElementById('pp-notes')?.value?.trim())
  const{error}=await sb.from('purchase_orders').insert(payload)
  if(error){showToast('建立失敗：'+error.message,'error');return}
  
  const po=await sb.from('purchase_orders').select('*').eq('id',id).single()
  if(po.data&&window._pendingPurchaseItems){
    for(const item of window._pendingPurchaseItems){
      await sb.from('purchase_order_items').insert({
        po_id:id,
        product_id:item.product_id||null,
        product_name:item.product_name,
        spec:item.spec||null,
        qty:item.qty,
        unit:item.unit,
        unit_price:item.unit_price,
        currency:item.currency,
        ref_order_id:item.ref_order_id||null,
        width_m:item.width_m||null,
        pricing_unit:item.pricing_unit||null
      })
    }
    delete window._pendingPurchaseItems
    _pendingPurchaseLinks=[]
  }
  
  _isDirty=false
  await loadPurchaseOrders()
  closeModal('modal-purchase')
  renderPurchaseOrders()
  logActivity('確認採購單','purchase',id,'')
  showToast('採購單已建立')
}

async function addPurchaseItemDirect(item){

  const{error}=await sb.from('purchase_order_items').insert({
    po_id:selectedPurchaseId,
    product_id:item.product_id||null,
    product_name:item.product_name||item.product,
    spec:item.spec||null,
    qty:item.qty||item.quantity,
    unit:item.unit,
    unit_price:item.unit_price||item.price,
    currency:item.currency||'USD',
    width_m:item.width_m||null,
    pricing_unit:item.pricing_unit||null
  })
  if(error){showToast('新增品項失敗：'+error.message,'error');return}
  await loadPurchaseOrders()
  openPurchaseModal(selectedPurchaseId)
  showToast('品項已加入')
}

function createPurchaseFromOrder(orderId){
  const o=orders.find(x=>x.id===orderId)
  if(!o)return
  const oItems=orderItems.filter(oi=>oi.order_id===o.id)
  if(!oItems.length){
    showToast('請先新增至少 1 筆產品品項，再建立採購單','error')
    return
  }
  const prefill={
    supplier_id:o.supplier_id??null,
    currency:o.currency,
    links:[],
    items:oItems.map(oi=>({
      product_id:oi.product_id||null,
      product_name:oi.product_name,
      spec:oi.spec,
      qty:oi.qty,
      unit:oi.unit,
      unit_price:oi.unit_price,
      currency:oi.currency||o.currency,
      width_m:oi.width_m||null,
      pricing_unit:oi.pricing_unit||null
    }))
  }
  window._pendingPurchaseItems=prefill.items
  _isDirty=false
  closeModal('modal-order')
  openPurchaseModal(null, prefill)
}

async function savePurchaseOrder(){
  if(!selectedPurchaseId)return
  const p=purchaseOrders.find(x=>x.id===selectedPurchaseId)
  if(!p)return
  const supplierId=parseInt(document.getElementById('pp-supplier')?.value||'',10)||null
  const linkedOrderId=null

  }

  assignIfPresent(payload,'accounting_no',document.getElementById('pp-accounting')?.value?.trim())
  assignIfPresent(payload,'expected_delivery',document.getElementById('pp-expected')?.value)
  assignIfPresent(payload,'currency',document.getElementById('pp-currency')?.value)
  assignIfPresent(payload,'notes',document.getElementById('pp-notes')?.value?.trim())
  const{error}=await sb.from('purchase_orders').update(payload).eq('id',selectedPurchaseId)
  if(error){showToast('儲存失敗：'+error.message,'error');return}
  _isDirty=false
  await loadPurchaseOrders()
  renderPurchaseOrders()
  openPurchaseModal(selectedPurchaseId)
  showToast('採購單已儲存')
}

async function addPurchaseItem(){
  const productName=document.getElementById('poi-name')?.value?.trim()
  const selectedProductId=document.getElementById('poi-product-id')?.value||''
  const spec=document.getElementById('poi-spec')?.value?.trim()||null
  const qty=parseFloat(document.getElementById('poi-qty')?.value)
  const unit=document.getElementById('poi-unit')?.value?.trim()
  const unitPrice=parseFloat(document.getElementById('poi-price')?.value)
  const currency=document.getElementById('poi-currency')?.value||'USD'
  const poiWidthM=(parseFloat(document.getElementById('poi-width-mm')?.value)||null)!=null?(parseFloat(document.getElementById('poi-width-mm').value)/1000)||null:null
  const poiPricingUnit=document.getElementById('poi-pricing-unit')?.value||null
  if(!productName||!qty||!unit||!unitPrice){showToast('請填寫品項資料','error');return}
  if(!selectedPurchaseId){
    if(!window._pendingPurchaseItems)window._pendingPurchaseItems=[]
    const pendingItem=makePendingPurchaseItem({product_id:selectedProductId?parseInt(selectedProductId,10):null,product_name:productName,spec,qty,unit,unit_price:unitPrice,currency,width_m:poiWidthM,pricing_unit:poiPricingUnit})
    window._pendingPurchaseItems.push(pendingItem)
    openPurchaseModal(null,{keepPending:true,keepPendingLinks:true,supplier_id:parseInt(document.getElementById('pp-supplier')?.value||'',10)||null,currency:document.getElementById('pp-currency')?.value||'USD'})
    _isDirty=true
    showToast('品項已加入')
    return
  }
  const{error}=await sb.from('purchase_order_items').insert({
    po_id:selectedPurchaseId,product_id:selectedProductId?parseInt(selectedProductId,10):null,product_name:productName,spec,qty,unit,unit_price:unitPrice,currency,width_m:poiWidthM,pricing_unit:poiPricingUnit
  })
  if(error){showToast('新增品項失敗：'+error.message,'error');return}
  await loadPurchaseOrders()
  openPurchaseModal(selectedPurchaseId)
  _isDirty=true
  showToast('品項已加入')
}

function switchPurchaseItemTab(tab){
  const catalog=document.getElementById('poi-tab-catalog')
  const order=document.getElementById('poi-tab-order')
  const btnCatalog=document.getElementById('poi-tab-btn-catalog')
  const btnOrder=document.getElementById('poi-tab-btn-order')
  if(!catalog||!order)return
  if(tab==='catalog'){
    catalog.style.display='block';order.style.display='none'
    if(btnCatalog){btnCatalog.style.borderBottom='2px solid #0F6E56';btnCatalog.style.color='#0F6E56'}
    if(btnOrder){btnOrder.style.borderBottom='2px solid transparent';btnOrder.style.color='#888'}
  } else {
    catalog.style.display='none';order.style.display='block'
    if(btnCatalog){btnCatalog.style.borderBottom='2px solid transparent';btnCatalog.style.color='#888'}
    if(btnOrder){btnOrder.style.borderBottom='2px solid #0F6E56';btnOrder.style.color='#0F6E56'}
  }
}

async function addItemsFromOrder(orderId){
  const checkboxes=[...document.querySelectorAll('.poi-order-item-chk:checked')]
  if(!checkboxes.length){showToast('請勾選至少一筆品項','error');return}
  const selectedIds=checkboxes.map(c=>parseInt(c.value))
  const selectedItems=orderItems.filter(i=>selectedIds.includes(i.id))
  if(!selectedPurchaseId){
    if(!window._pendingPurchaseItems)window._pendingPurchaseItems=[]
    selectedItems.forEach(it=>{
      window._pendingPurchaseItems.push(makePendingPurchaseItem({
        product_id:it.product_id||null,
        product_name:it.product_name,
        spec:it.spec||null,
        qty:it.qty,
        unit:it.unit||null,
        unit_price:it.unit_price||0,
        currency:it.currency||'USD',
        ref_order_id:orderId,
        width_m:it.width_m||null,
        pricing_unit:it.pricing_unit||null
      }))
    })
    const supplierId=parseInt(document.getElementById('pp-supplier')?.value||'',10)||null
    openPurchaseModal(null,{keepPending:true,keepPendingLinks:true,supplier_id:supplierId,currency:document.getElementById('pp-currency')?.value||'USD'})
    _isDirty=true
    showToast(selectedItems.length+' 筆品項已加入')
    return
  }
  for(const it of selectedItems){
    const{error}=await sb.from('purchase_order_items').insert({
      po_id:selectedPurchaseId,
      product_id:it.product_id||null,
      product_name:it.product_name,
      spec:it.spec||null,
      qty:it.qty,
      unit:it.unit||null,
      unit_price:it.unit_price||0,
      currency:it.currency||'USD',
      ref_order_id:orderId,
      width_m:it.width_m||null,
      pricing_unit:it.pricing_unit||null
    })
    if(error){showToast('新增品項失敗：'+error.message,'error');return}
  }
  await loadPurchaseOrders()
  openPurchaseModal(selectedPurchaseId)
  _isDirty=true
  showToast(selectedItems.length+' 筆品項已加入')
}

function showArrivalInput(itemId){
  const el=document.getElementById('arrival-input-'+itemId)
  if(el)el.style.display=el.style.display==='none'?'block':'none'
}

async function submitArrival(itemId){
  const qtyInput=document.getElementById('arrival-qty-'+itemId)
  const arrived=parseFloat(qtyInput?.value)||0
  if(arrived<=0){showToast('請輸入有效數量','error');return}
  const item=purchaseOrderItems.find(x=>x.id===itemId)
  if(!item)return
  const newReceived=(parseFloat(item.received_qty)||0)+arrived
  const{error}=await sb.from('purchase_order_items').update({received_qty:newReceived}).eq('id',itemId)
  if(error){showToast('更新失敗：'+error.message,'error');return}
  if(item.product_id){
    const prod=products.find(x=>x.id===item.product_id)
    if(prod!=null){
      const deltaRolls=poQtyToRolls(arrived,item.unit||'m',prod)
      if(deltaRolls===null){showToast('注意：'+prod.product_name+' 未設每卷米數，庫存未自動更新','error')}
      else{
        await sb.from('products').update({stock_qty:(parseFloat(prod.stock_qty)||0)+deltaRolls}).eq('id',item.product_id)
      }
      await loadProducts()
    }
  }
  await loadPurchaseOrders()
  const poItems=purchaseOrderItems.filter(x=>x.po_id===selectedPurchaseId)
  const allReceived=poItems.length>0&&poItems.every(x=>(parseFloat(x.received_qty)||0)>=(parseFloat(x.qty)||0))
  if(allReceived){
    await sb.from('purchase_orders').update({status:'received'}).eq('id',selectedPurchaseId)
    await loadPurchaseOrders()
    showToast('全部品項已到齊，採購單狀態更新為已到貨')
  } else {
    showToast('到貨已登記')
  }
  renderPurchaseOrders()
  openPurchaseModal(selectedPurchaseId)
}

function pshopShowTopbarControls(show){

function pshopLeave(){
  if(_pshopCart.length){
    confirmModal('有商品在採購車中，確定要放棄並返回嗎？',()=>{
      _pshopCart=[]
      _pshopActiveCompany=null

    })
  } else {
    _pshopActiveCompany=null
    pshopShowTopbarControls(false)
    switchTab('purchases')
  }
}

function pshopInitPage(){
  // build supplier list from products
  const byCompany=new Map()
  suppliers.forEach(s=>{
    const count=products.filter(p=>p.supplier_id===s.id&&p.is_active!==false).length
    if(count>0){
      if(!byCompany.has(s.company)||byCompany.get(s.company).count<count)
        byCompany.set(s.company,{id:s.id,count})
    }
  })
  const list=[...byCompany.entries()].sort((a,b)=>a[0].localeCompare(b[0],'zh-TW'))
  if(!_pshopActiveCompany&&list.length)_pshopActiveCompany=list[0][0]
  renderPshopSupplierTabs(list)
  renderPshopProductArea()
  renderPshopOrderSection()
  renderPshopCart()
  pshopShowTopbarControls(true)
  pshopSyncResponsive()
}

function renderPshopSupplierTabs(list){
  const el=document.getElementById('pshop-supplier-tabs')
  if(!el)return
  if(!list){
    const byCompany=new Map()
    suppliers.forEach(s=>{
      const count=products.filter(p=>p.supplier_id===s.id&&p.is_active!==false).length
      if(count>0){if(!byCompany.has(s.company))byCompany.set(s.company,{id:s.id,count})}
    })
    list=[...byCompany.entries()].sort((a,b)=>a[0].localeCompare(b[0],'zh-TW'))
  }
  el.innerHTML=list.map(([company,{id,count}])=>{
    const active=company===_pshopActiveCompany
    return '<button onclick="pshopSelectCompany(\''+esc(company)+'\')" style="flex-shrink:0;padding:10px 14px;border:none;border-bottom:2px solid '+(active?'#0F6E56':'transparent')+';background:none;cursor:pointer;font-size:13px;font-weight:'+(active?'600':'400')+';color:'+(active?'#0F6E56':'#555')+';white-space:nowrap;transition:all 0.12s">'+
      esc(company)+' <span style="font-size:11px;color:#aaa">('+count+')</span>'+
      '</button>'
  }).join('')
}

function pshopSelectCompany(company){
  if(company===_pshopActiveCompany)return
  if(_pshopCart.length){
    confirmModal('切換供應商將清空採購車，確定嗎？',()=>{
      _pshopCart=[]
      _pshopActiveCompany=company
      pshopInitPage()
    })
  } else {
    _pshopActiveCompany=company
    pshopInitPage()
  }
}

function pshopSetLayout(layout){

function pshopUpdateRollsHint(productId, metersPerRoll){
  const qtyEl=document.getElementById('pshop-qty-'+productId)
  const hintEl=document.getElementById('pshop-rolls-hint-'+productId)
  if(!hintEl)return
  if(!metersPerRoll){hintEl.textContent='';return}
  const qty=parseFloat(qtyEl?.value)||0
  hintEl.textContent=qty>0?'約 '+(Math.round(qty/metersPerRoll*10)/10).toFixed(1)+' 卷':''
}

function pshopAddToCart(productId){
  const p=products.find(x=>x.id===productId)
  if(!p)return
  const qtyEl=document.getElementById('pshop-qty-'+productId)
  const qty=parseFloat(qtyEl?.value)||1
  const rolls_qty=p.meters_per_roll?Math.round(qty/p.meters_per_roll*10)/10:null
  const existing=_pshopCart.findIndex(c=>c.product_id===productId&&!c.ref_order_id)
  if(existing>=0){
    _pshopCart[existing].qty=qty
    _pshopCart[existing].rolls_qty=rolls_qty
  } else {
    _pshopCart.push({product_id:p.id,product_name:p.product_name,spec:p.spec||null,unit:'m',unit_price:p.cost_price||0,currency:p.currency||'USD',qty,rolls_qty,ref_order_id:null,meters_per_roll:p.meters_per_roll||null,width_m:p.width_m||null,pricing_unit:p.pricing_unit||null})
  }
  renderPshopProductArea()
  renderPshopCart()
  pshopSyncResponsive()
}

function pshopAddFromOrder(orderId){
  const supIds=pshopGetActiveSupplierIds()
  const checked=[...document.querySelectorAll('.pshop-order-item-chk[data-order-id="'+orderId+'"]:checked')]
  if(!checked.length){showToast('請勾選至少一筆品項','error');return}
  const selectedIds=checked.map(c=>parseInt(c.value))
  const selectedItems=orderItems.filter(i=>selectedIds.includes(i.id)&&supIds.includes(i.supplier_id))
  selectedItems.forEach(it=>{
    const existing=_pshopCart.findIndex(c=>c.product_id===it.product_id&&c.ref_order_id===orderId)
    if(existing>=0){_pshopCart[existing].qty=(parseFloat(_pshopCart[existing].qty)||0)+(parseFloat(it.qty)||1)}
    else{_pshopCart.push({product_id:it.product_id||null,product_name:it.product_name,spec:it.spec||null,unit:it.unit||null,unit_price:it.unit_price||0,currency:it.currency||'USD',qty:parseFloat(it.qty)||1,ref_order_id:orderId})}
  })
  renderPshopProductArea()
  renderPshopCart()
  pshopSyncResponsive()
  showToast(selectedItems.length+' 筆品項已加入採購車')
}

function pshopRemoveFromCart(idx){
  _pshopCart.splice(idx,1)
  renderPshopCart()
  renderPshopProductArea()
  pshopSyncResponsive()
  // refresh mobile overlay if open
  const mEl=document.getElementById('pshop-mobile-cart-items')
  if(mEl&&document.getElementById('pshop-mobile-cart-overlay')?.style.display==='flex')renderPshopCartRowsInto(mEl)
}

function pshopUpdateCartQty(idx,val){
  const q=parseFloat(val)||0
  if(q<=0)_pshopCart.splice(idx,1)
  else _pshopCart[idx].qty=q
  renderPshopCart()
  pshopSyncResponsive()
  const mEl=document.getElementById('pshop-mobile-cart-items')
  if(mEl&&document.getElementById('pshop-mobile-cart-overlay')?.style.display==='flex')renderPshopCartRowsInto(mEl)
}

function pshopItemAmt(c){const wm=parseFloat(c.width_m||0);return c.pricing_unit==='m2'&&wm>0?(c.unit_price||0)*c.qty*wm:(c.unit_price||0)*c.qty}
function pshopCartTotalStr(){
  if(!_pshopCart.length)return''
  const total=_pshopCart.reduce((s,c)=>s+pshopItemAmt(c),0)
  const currency=_pshopCart[0]?.currency||'USD'
  return'總計 '+total.toFixed(2)+' '+currency
}

async function confirmShopOrder(){
  if(!_pshopActiveCompany){showToast('請先選擇供應商','error');return}
  if(!_pshopCart.length){showToast('採購車為空','error');return}
  const supEntry=suppliers.find(s=>s.company===_pshopActiveCompany)
  if(!supEntry){showToast('找不到供應商','error');return}
  const supplierId=supEntry.id
  const id=generatePurchaseId()
  const currency=document.getElementById('pshop-currency')?.value||'USD'
  const payload={id,supplier_id:supplierId,status:'draft',source:'stock',currency}
  const accounting=document.getElementById('pshop-accounting')?.value?.trim()
  const delivery=document.getElementById('pshop-delivery')?.value
  const notes=document.getElementById('pshop-notes')?.value?.trim()
  if(accounting)payload.accounting_no=accounting
  if(delivery)payload.expected_delivery=delivery
  if(notes)payload.notes=notes
  const{error}=await sb.from('purchase_orders').insert(payload)
  if(error){showToast('建立失敗：'+error.message,'error');return}
  for(const item of _pshopCart){
    const{error:ie}=await sb.from('purchase_order_items').insert({
      po_id:id,
      product_id:item.product_id||null,
      product_name:item.product_name,
      spec:item.spec||null,
      qty:item.qty,
      unit:'m',
      unit_price:item.unit_price||0,
      currency:item.currency||currency,
      ref_order_id:item.ref_order_id||null,
      width_m:item.width_m||null,
      pricing_unit:item.pricing_unit||null,
      amount:pshopItemAmt(item)
    })
    if(ie){showToast('品項新增失敗：'+ie.message,'error');return}
  }
  _pshopCart=[]
  _pshopActiveCompany=null
  closeModal('modal-pshop-checkout')
  showToast('採購單 '+id+' 已建立')
  await loadPurchaseOrders()
  switchTab('purchases')
  renderPurchaseOrders()
  setTimeout(()=>openPurchaseModal(id),100)
}

function renderInquiries(){
  const fS=document.getElementById('f-status')?.value||''
  const fC=document.getElementById('f-customer')?.value||''
  const fP=(document.getElementById('f-product')?.value||'').toLowerCase()
  const fF=document.getElementById('f-date-from')?.value||''
  const fT=document.getElementById('f-date-to')?.value||''
  let list=inquiries.filter(i=>{
    if(fS&&i.status!==fS)return false
    if(fC&&i.customer!==fC)return false
    if(fP&&!i.product?.toLowerCase().includes(fP))return false
    if(fF&&i.created_at<fF)return false
    if(fT&&i.created_at.slice(0,10)>fT)return false
    return true
  })
  const active=list.filter(i=>i.status!=='closed')
  const closed=list.filter(i=>i.status==='closed')
  document.getElementById('inq-summary').textContent=active.length+' 筆進行中 / 共 '+list.length+' 筆'
  let html=active.map(i=>inqRowHtml(i)).join('')
  if(closed.length)html+='<div style="font-size:11px;color:#aaa;margin:12px 0 6px">已結案（'+closed.length+'）</div>'+closed.map(i=>inqRowHtml(i)).join('')
  document.getElementById('inquiry-list').innerHTML=html||'<div class="loading">無符合條件的詢價</div>'
}
function displayCustomerName(rawName){
  if(!rawName)return '—'
  if(customers.some(c=>c.company===rawName))return rawName
  const testPrefixed='[TEST] '+rawName
  if(customers.some(c=>c.company===testPrefixed))return testPrefixed
  if(rawName.startsWith('[TEST] ')){
    const plain=rawName.replace(/^\[TEST\]\s*/,'').trim()
    if(customers.some(c=>c.company===plain))return plain
  }
  return rawName
}

function inqRowHtml(i){
  const level=inquiryFollowupLevel(i)
  const overdue=level==='overdue'&&!['sent_to_quote','closed'].includes(i.status)
  const warn=level==='warn'&&!['sent_to_quote','closed'].includes(i.status)
  return '<div class="row '+(overdue?'overdue':warn?'warning':'')+'" onclick="openInqModal(\''+i.id+'\')">'+
    '<div style="flex:1;min-width:0">'+
    '<div style="display:flex;align-items:center;gap:7px;margin-bottom:3px;flex-wrap:wrap">'+
    '<span style="font-size:10px;color:#aaa;font-family:monospace">'+i.id+'</span>'+
      '<span style="font-size:13px;font-weight:500">'+displayCustomerName(i.customer)+'</span>'+
      (overdue?'<span class="overdue-tag">⚠ 待追詢</span>':warn?'<span class="badge" style="background:#FFF6DA;color:#8A6500;border:1px solid #D2B14A">提醒中</span>':'')+
    '</div>'+
    '<div style="font-size:12px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px">'+i.product+'</div>'+
    '<div style="font-size:11px;color:#aaa">'+(i.supplier?i.supplier.split('—')[0].trim():'—')+(['pending','asked'].includes(i.status)?' · '+inquiryPendingDays(i)+' 天未回覆':'')+'</div>'+
    '</div>'+badge(i.status)+'</div>'
}

  document.getElementById('catalog-picker-overlay')?.remove()

  const idEl=document.getElementById('nf-product-id')
  const specEl=document.getElementById('nf-spec')

  if(prodEl)prodEl.value=p.product_name
  if(idEl)idEl.value=p.id
  if(specEl&&!specEl.value&&p.notes)specEl.value=p.notes
  if(supSel&&p.supplier_id){

    if(sup){
      const opt=[...supSel.options].find(o=>o.value===sup.company)
      if(opt)supSel.value=sup.company

      supSel.style.background='#f8f8f5'

    }
  }
}

function escHtmlInq(s){return escapeHtml(s)}
function getInquirySupplierPriceParts(raw){
  const text=String(raw||'').trim()
  const slashIdx=text.lastIndexOf('/')
  const unit=slashIdx>=0?text.slice(slashIdx+1).trim():''
  const priceText=slashIdx>=0?text.slice(0,slashIdx).trim():text
  const amount=parseFloat(priceText.match(/[\d.]+/)?.[0]||'')||''
  const currency=priceText.replace(/[\d.,\s]+/g,'').trim()||settings.default_cost_currency||'USD'
  return {amount,currency,unit}
}

async function saveInqToProduct(inqId){
  const name=document.getElementById('atp-name')?.value.trim()
  if(!name){showToast('請填寫產品名稱','error');return}
  const costVal=document.getElementById('atp-cost')?.value
  if(!costVal){showToast('請填寫成本價','error');return}
  const data={
    product_name:name,
    product_code:document.getElementById('atp-code')?.value.trim()||null,
    supplier_id:parseInt(document.getElementById('atp-supplier')?.value)||null,
    unit:document.getElementById('atp-unit')?.value.trim()||null,
    cost_price:parseFloat(costVal),
    currency:document.getElementById('atp-currency')?.value||'USD',
    review_days:getProductReviewDays(),
    last_reviewed_at:new Date().toISOString().slice(0,10),
    notes:document.getElementById('atp-notes')?.value.trim()||null,
    is_active:document.getElementById('atp-active')?.value==='true'
  }
  const{data:inserted,error}=await sb.from('products').insert(data).select().single()
  if(error){showToast('新增失敗：'+error.message,'error');return}
  await loadProducts()
  if(inserted?.id){
    await sb.from('inquiries').update({from_product_id:inserted.id}).eq('id',inqId)
    await loadInquiries()
  }
  document.getElementById('add-to-product-overlay')?.remove()
  renderInqModalBd()
  showToast('已加入產品目錄')
}

let _pendingStqInqId=null,_pendingStqRawCost=null,_pendingStqRawCur=null
async function sendToQuote(inqId){
  const i=inquiries.find(x=>x.id===inqId);if(!i)return
  if(i.from_product_id&&i.supplier_price){
    const p=products.find(x=>x.id===i.from_product_id)
    if(p&&p.cost_price!=null){
      const priceParts=getInquirySupplierPriceParts(i.supplier_price)
      const rawCost=priceParts.amount?parseFloat(priceParts.amount):null
      const rawCur=priceParts.currency||'USD'
      const sameCost=rawCost!=null&&Math.abs(rawCost-p.cost_price)<0.00001
      const sameCur=rawCur===p.currency
      if(!sameCost||!sameCur){
        _pendingStqInqId=inqId;_pendingStqRawCost=rawCost;_pendingStqRawCur=rawCur
        document.getElementById('modal-cost-diff-bd').innerHTML=
          '<div style="margin-bottom:16px;font-size:13px;line-height:1.8">'+
          '<div style="margin-bottom:8px">目前目錄成本：<strong>'+parseFloat(p.cost_price||0).toFixed(2)+' '+p.currency+'</strong>　上次更新：'+(p.last_reviewed_at||'—')+'</div>'+
          '<div>本次供應商報價：<strong>'+parseFloat(rawCost||0).toFixed(2)+' '+rawCur+'</strong></div>'+
          '</div>'+
          '<div class="modal-foot">'+
          '<button class="btn btn-primary" onclick="_doSendToQuote(true)">同步更新目錄並送報價</button>'+
          '<button class="btn btn-ghost" onclick="_doSendToQuote(false)">不更新，直接送報價</button>'+
          '</div>'
        document.getElementById('modal-cost-diff').classList.add('open')
        return
      }
    }
  }
  await _execSendToQuote(inqId)
}
async function _doSendToQuote(updateCatalog){
  closeModal('modal-cost-diff')
  if(updateCatalog&&_pendingStqInqId){
    const i=inquiries.find(x=>x.id===_pendingStqInqId)
    if(i?.from_product_id){
      await sb.from('products').update({
        cost_price:_pendingStqRawCost,
        currency:_pendingStqRawCur,
        last_reviewed_at:new Date().toISOString().slice(0,10)
      }).eq('id',i.from_product_id)
      await loadProducts();renderProducts();updateProductOverdueAlert()
    }
  }
  await _execSendToQuote(_pendingStqInqId)
}
async function _execSendToQuote(inqId){
  const i=inquiries.find(x=>x.id===inqId);if(!i)return
  const inquirySupplier=suppliers.find(s=>s.company===i.supplier)
  const priceParts=getInquirySupplierPriceParts(i.supplier_price)
  const rawCost=priceParts.amount?parseFloat(priceParts.amount):null
  const rawCur=priceParts.currency||'USD'
  const linkedProduct=i.from_product_id?products.find(p=>p.id===i.from_product_id):null
  const newItemBase={
    product:i.product,spec:i.spec||null,supplier_id:inquirySupplier?.id||null,
    product_id:i.from_product_id||null,
    cost_price:rawCost,cost_currency:rawCur,
    customs_fee_pct:parseFloat(settings.default_customs_fee_pct||7.5),
    apply_customs:supplierNeedsCustoms(inquirySupplier?.id||null),
    margin_pct:parseFloat(settings.default_margin_pct||20),
    final_price:rawCost?(Math.round(calcQuote(rawCost,settings.default_customs_fee_pct||7.5,settings.default_margin_pct||20,supplierNeedsCustoms(inquirySupplier?.id||null)).final*100)/100):null,
    moq:i.moq||null,lead_time:i.lead_time||null,
    width_m:linkedProduct?.width_m??null,
    pricing_unit:linkedProduct?.pricing_unit||null,
    customer_pricing_unit:linkedProduct?.pricing_unit||null
  }

  // Check if a quote already exists for this inquiry
  const existingAll=quoteHeaders.filter(h=>h.inquiry_id===inqId)
  if(existingAll.length){
    const latest=existingAll.reduce((a,b)=>((a.version||1)>=(b.version||1)?a:b))
    const latestItems=quoteItems.filter(it=>it.header_id===latest.id)
    const newV=(latest.version||1)+1
    const newId=latest.id.replace(/-v\d+$/,'')+'-v'+newV
    const{error}=await sb.from('quote_headers').insert({
      id:newId,inquiry_id:inqId,customer:i.customer,supplier:i.supplier,version:newV,status:'draft'
    })
    if(error){showToast('建立新版本失敗：'+error.message,'error');return}
    const{error:e2}=await sb.from('quote_items').insert({header_id:newId,...newItemBase})
    if(e2){showToast('品項建立失敗：'+e2.message,'error');return}
    // Save previous version's prices as a change record on the new header
    const snapshot=latestItems.map(it=>{
      const cp=parseFloat(it.cost_price||0)
      const{final}=calcQuote(cp,it.customs_fee_pct,it.margin_pct,shouldApplyCustoms(it))
      return{product:it.product,cost_price:it.cost_price,cost_currency:it.cost_currency,margin_pct:it.margin_pct,quoted_price:it.final_price!=null?it.final_price:parseFloat(final.toFixed(2))}
    })
    await sb.from('quote_changes').insert({
      header_id:newId,
      changed_by:currentUser?.name||currentUser?.email||'system',
      change_type:'from_inquiry',
      note:'前版本 '+latest.id+' 報價快照',
      snapshot,
      changed_at:new Date().toISOString()
    })
    await sb.from('quote_headers').update({status:'superseded'}).eq('id',latest.id)
    await sb.from('inquiries').update({status:'sent_to_quote'}).eq('id',inqId)
    logActivity('送去報價','inquiry',inqId,'')
    await Promise.all([loadInquiries(),loadQuotes(),loadQuoteChanges()])
    renderInquiries();closeModal('modal-inq');switchTab('quotes')
    openQuoteModal(newId)
    showToast('已建立新版本 v'+newV+'，前版報價已記錄於修改歷史')
    return
  }

  // No existing quote — create fresh v1
  const hId='QUO-'+inqId.replace('INQ-','')+'-v1'
  const{error}=await sb.from('quote_headers').insert({
    id:hId,inquiry_id:inqId,customer:i.customer,supplier:i.supplier,version:1,status:'draft'
  })
  if(error){showToast('送去報價失敗：'+error.message,'error');return}
  const{error:e2}=await sb.from('quote_items').insert({header_id:hId,...newItemBase})
  if(e2){showToast('品項建立失敗：'+e2.message,'error');return}
  await sb.from('inquiries').update({status:'sent_to_quote'}).eq('id',inqId)
  logActivity('送去報價','inquiry',inqId,'')
  await Promise.all([loadInquiries(),loadQuotes()])
  renderInquiries();closeModal('modal-inq');switchTab('quotes')
  showToast('已送去報價')
}

function renderQuotes(){
  const el=document.getElementById('quote-list')
  const sum=document.getElementById('quote-summary')
  if(!el)return
  const fStatus=document.getElementById('fq-status')?.value||''
  const fCustomer=(document.getElementById('fq-customer')?.value||'').toLowerCase()
  const fProduct=(document.getElementById('fq-product')?.value||'').toLowerCase()
  const fFrom=document.getElementById('fq-date-from')?.value||''
  const fTo=document.getElementById('fq-date-to')?.value||''
  let filtered=quoteHeaders.filter(h=>{
    const items=quoteItems.filter(it=>it.header_id===h.id)
    const created=(h.created_at||'').slice(0,10)
    if(!fStatus&&h.status==='superseded')return false
    if(fStatus&&h.status!==fStatus)return false
    if(fCustomer&&!String(h.customer||'').toLowerCase().includes(fCustomer))return false
    if(fProduct&&!items.some(it=>String(it.product||'').toLowerCase().includes(fProduct)))return false
    if(fFrom&&created&&created<fFrom)return false
    if(fTo&&created&&created>fTo)return false
    return true
  })
  const active=quoteHeaders.filter(h=>!['accepted','rejected','sample_review','sample_pending'].includes(h.status))
  if(sum)sum.textContent=filtered.length+' 筆符合 / '+active.length+' 筆進行中 / 共 '+quoteHeaders.length+' 筆'
  if(!quoteHeaders.length){el.innerHTML='<div class="loading">尚無報價，從詢價頁按「收到成本 → 送去報價」，或點「直接新增報價單」</div>';return}
  if(!filtered.length){el.innerHTML='<div class="loading">沒有符合篩選條件的報價</div>';return}
  el.innerHTML=filtered.map(h=>{
    const items=quoteItems.filter(it=>it.header_id===h.id)
    const d=new Date(h.created_at).toLocaleDateString('zh-TW')
    return '<div class="row" onclick="openQuoteModal(\''+h.id+'\')">'+
      '<div style="flex:1;min-width:0">'+
      '<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:3px">'+
      '<span style="font-size:10px;color:#aaa;font-family:monospace">'+h.id+'</span>'+
      '<span style="font-size:13px;font-weight:500">'+h.customer+'</span>'+
      (h.source==='direct'?'<span style="font-size:10px;color:#185FA5;background:#E6F1FB;padding:1px 6px;border-radius:5px;border:1px solid #B5D4F4">直接建立</span>':'')+
      '</div>'+
      '<div style="font-size:12px;color:#666">'+(items.length?items.map(it=>it.product).join('、'):'—')+'</div>'+
      '<div style="font-size:11px;color:#aaa">'+d+' · 供應商：'+(h.supplier||'—')+'</div>'+
      '</div>'+badge(h.status,QUO_STATUS)+'</div>'
  }).join('')
}

async function editQuote(){
  const h=quoteHeaders.find(x=>x.id===selectedQuoteId);if(!h)return
  const items=quoteItems.filter(it=>it.header_id===h.id)
  const snapshot=items.map(it=>{
    const cp=parseFloat(it.cost_price||0)
    const applyC=shouldApplyCustoms(it)
    const{final}=calcQuote(cp,it.customs_fee_pct,it.margin_pct,applyC)
    return{product:it.product,cost_price:it.cost_price,cost_currency:it.cost_currency,margin_pct:it.margin_pct,quoted_price:parseFloat(final.toFixed(2))}
  })
  const{error}=await sb.from('quote_changes').insert({
    header_id:h.id,
    changed_by:currentUser?.name||currentUser?.email||'unknown',
    change_type:'edit',
    note:'修改報價前快照',
    snapshot,
    changed_at:new Date().toISOString()
  })
  if(error){showToast('快照儲存失敗：'+error.message,'error');return}
  const{error:e2}=await sb.from('quote_headers').update({status:'draft'}).eq('id',h.id)
  if(e2){showToast('狀態更新失敗：'+e2.message,'error');return}
  await Promise.all([loadQuotes(),loadQuoteChanges()])
  renderQuotes();renderQuoteModalHd();renderQuoteModalBd()
  showToast('已儲存修改前快照，請更新報價內容後重新送出')
}

function qItemChange(id,field,value){
  const it=quoteItems.find(x=>String(x.id)===String(id))
  if(field==='apply_customs'&&!supplierNeedsCustoms(it?.supplier_id)){
    value=false
  }
  if(!_qPendingItems[id])_qPendingItems[id]={}
  _qPendingItems[id][field]=value
  if(it){
    it[field]=value
    const cp=parseFloat(it.cost_price||0)
    if(cp>0&&it.final_price!=null){
      const applyC=shouldApplyCustoms(it)
      const afterCustoms=applyC?cp*(1+parseFloat(it.customs_fee_pct||0)/100):cp
      const mgn=afterCustoms>0?Math.round((it.final_price/afterCustoms-1)*10000)/100:0
      it.margin_pct=mgn
      _qPendingItems[id].margin_pct=mgn
    } else if(cp>0){
      const{final}=calcQuote(cp,it.customs_fee_pct,it.margin_pct,shouldApplyCustoms(it))
      it.final_price=Math.round(final*100)/100
      _qPendingItems[id].final_price=it.final_price
    }
  }
  renderQuoteModalBd()
}
function qItemChangeFinalPrice(id,fp){
  const it=quoteItems.find(x=>String(x.id)===String(id))
  if(!it)return
  if(!_qPendingItems[id])_qPendingItems[id]={}
  const cp=parseFloat(it.cost_price||0)
  const applyC=shouldApplyCustoms(it)
  const afterCustoms=applyC?cp*(1+parseFloat(it.customs_fee_pct||0)/100):cp
  const mgn=afterCustoms>0?Math.round((fp/afterCustoms-1)*10000)/100:0
  it.final_price=Math.round(fp*100)/100
  it.margin_pct=mgn
  _qPendingItems[id].final_price=it.final_price
  _qPendingItems[id].margin_pct=mgn
  renderQuoteModalBd()
}

function qiModalChange(field,value){
  const it=quoteItems.find(x=>String(x.id)===_selectedQiId)
  if(!it)return
  if(!_qPendingItems[_selectedQiId])_qPendingItems[_selectedQiId]={}
  it[field]=value
  _qPendingItems[_selectedQiId][field]=value
  // if customs settings changed, recalculate margin from existing final_price
  if((field==='customs_fee_pct'||field==='apply_customs')&&it.final_price!=null){
    const cp=parseFloat(it.cost_price||0)
    const applyC=shouldApplyCustoms(it)
    const afterCustoms=applyC?cp*(1+parseFloat(it.customs_fee_pct||0)/100):cp
    const mgn=afterCustoms>0?Math.round((it.final_price/afterCustoms-1)*10000)/100:0
    it.margin_pct=mgn
    _qPendingItems[_selectedQiId].margin_pct=mgn
    const mgnEl=document.getElementById('qi-modal-mgn')
    if(mgnEl){const mc=mgn<5?'#e55':mgn<15?'#e88a00':'#0F6E56';mgnEl.style.color=mc;mgnEl.textContent='利潤率 '+mgn.toFixed(2)+'%'}
  }
}
function qiModalCustomsChange(checked){
  const it=quoteItems.find(x=>String(x.id)===_selectedQiId)
  if(!it)return
  if(!_qPendingItems[_selectedQiId])_qPendingItems[_selectedQiId]={}
  it.apply_customs=checked
  _qPendingItems[_selectedQiId].apply_customs=checked
  if(it.final_price!=null){
    const cp=parseFloat(it.cost_price||0)
    const afterCustoms=checked?cp*(1+parseFloat(it.customs_fee_pct||0)/100):cp
    const mgn=afterCustoms>0?Math.round((it.final_price/afterCustoms-1)*10000)/100:0
    it.margin_pct=mgn
    _qPendingItems[_selectedQiId].margin_pct=mgn
    const mgnEl=document.getElementById('qi-modal-mgn')
    if(mgnEl){const mc=mgn<5?'#e55':mgn<15?'#e88a00':'#0F6E56';mgnEl.style.color=mc;mgnEl.textContent='利潤率 '+mgn.toFixed(2)+'%'}
  }
}
function qiModalFpChange(fp){
  const it=quoteItems.find(x=>String(x.id)===_selectedQiId)
  if(!it)return
  if(!_qPendingItems[_selectedQiId])_qPendingItems[_selectedQiId]={}
  const cp=parseFloat(it.cost_price||0)

function filterQuoteCatalogPicker(q){

async function syncHeaderSupplier(){
  const items=quoteItems.filter(it=>it.header_id===selectedQuoteId)
  if(!items.length)return
  const sids=[...new Set(items.map(it=>it.supplier_id).filter(Boolean))]
  if(sids.length!==1)return
  const sup=suppliers.find(s=>s.id===sids[0])
  if(!sup)return
  const h=quoteHeaders.find(x=>x.id===selectedQuoteId)
  if(h&&h.supplier!==sup.company){
    await sb.from('quote_headers').update({supplier:sup.company}).eq('id',selectedQuoteId)
    h.supplier=sup.company
  }
}

  } else {

async function newQuoteVersion(){
  const h=quoteHeaders.find(x=>x.id===selectedQuoteId);if(!h)return
  const items=quoteItems.filter(it=>it.header_id===h.id)
  const newV=h.version+1
  const newId=h.id.replace(/-v\d+$/,'')+'-v'+newV
  const{error}=await sb.from('quote_headers').insert({
    id:newId,inquiry_id:h.inquiry_id||null,customer:h.customer,supplier:h.supplier,version:newV,status:'draft',notes:h.notes,source:h.source||null
  })
  if(!error)await sb.from('quote_headers').update({status:'superseded'}).eq('id',h.id)
  if(error){showToast('建立新版本失敗：'+error.message,'error');return}
  if(items.length){
    let hasStale=false
    const newItems=items.map(({id:_,...rest})=>{
      if(rest.product_id){
        const p=products.find(x=>x.id===rest.product_id)
        if(p){return{...rest,header_id:newId,cost_price:p.cost_price??rest.cost_price,cost_currency:p.currency||rest.cost_currency}}
        hasStale=true
      }
      return{...rest,header_id:newId}
    })
    const{error:e2}=await sb.from('quote_items').insert(newItems)
    if(e2){showToast('品項複製失敗：'+e2.message,'error');return}
    if(hasStale)showToast('部分品項無法自動更新成本，請手動確認','warn')
  }
  await loadQuotes();selectedQuoteId=newId;_qPendingItems={};_qPendingHeader={}
  renderQuotes();renderQuoteModalHd();renderQuoteModalBd()
  showToast('新版本 v'+newV+' 已建立')
}

async function sendQuoteToOrder(){
  const h=quoteHeaders.find(x=>x.id===selectedQuoteId);if(!h)return
  const items=quoteItems.filter(i=>i.header_id===h.id)
  const cust=customers.find(c=>c.company===h.customer)
  const sup=suppliers.find(s=>s.company===h.supplier)
  await loadOrders()
  const orderId=generateOrderId()
  const today=new Date().toISOString().slice(0,10)
  const{error:oErr}=await sb.from('orders').insert({
    id:orderId,
    customer_id:cust?.id||null,
    supplier_id:sup?.id||null,
    quote_header_id:h.id,
    order_date:today,
    currency:items[0]?.cost_currency||'USD',
    status:'confirmed',
    total_amount:0
  })
  if(oErr){showToast('建立訂單失敗：'+oErr.message,'error');return}
  if(items.length){
    const oiRows=items.map(it=>{
      const _up=it.final_price!=null?it.final_price:(()=>{
        const cp=parseFloat(it.cost_price||0)
        const{final}=calcQuote(cp,it.customs_fee_pct,it.margin_pct,shouldApplyCustoms(it))
        return Math.round(final*100)/100
      })()
      const cpu=it.customer_pricing_unit||'m2'
      const resolvedWm=it.width_m||(it.product_id?products.find(p=>p.id===it.product_id)?.width_m:null)||null
      const wm=parseFloat(resolvedWm||0)
      const amt=cpu==='m2'&&wm>0?_up*wm:_up
      return{order_id:orderId,product_name:it.product,spec:it.spec||null,qty:1,unit:it.moq||null,unit_price:_up,currency:it.cost_currency||'USD',width_m:resolvedWm,pricing_unit:it.pricing_unit||null,customer_pricing_unit:cpu,amount:parseFloat(amt.toFixed(4))}
    })
    const{error:iErr}=await sb.from('order_items').insert(oiRows)
    if(iErr){showToast('品項寫入失敗：'+iErr.message,'error');return}
    const total=oiRows.reduce((s,i)=>s+(i.amount||0),0)
    await sb.from('orders').update({total_amount:total}).eq('id',orderId)
  }
  await loadOrders()
  closeModal('modal-quote')
  showToast('訂單已建立')
  setTimeout(()=>{switchTab('orders');setTimeout(()=>openOrderModal(orderId),80)},200)
}

async function saveSettings(){
  if(!isManager()){
    showToast('只有管理者可以儲存系統設定','error')
    return
  }
  const customerReviewDays=parseInt(document.getElementById('set-customer-review-days')?.value,10)||180
  const productReviewDays=parseInt(document.getElementById('set-product-review-days')?.value,10)||90
  const inquiryWarnDays=Math.max(1,parseInt(document.getElementById('set-inquiry-warn-days')?.value,10)||2)
  const inquiryOverdueDays=Math.max(inquiryWarnDays,parseInt(document.getElementById('set-inquiry-overdue-days')?.value,10)||3)
  const rows=[
    {key:'default_customs_fee_pct',value:document.getElementById('set-customs').value,label:'預設清關手續費'},
    {key:'default_margin_pct',value:document.getElementById('set-margin').value,label:'預設利潤'},
    {key:'default_cost_currency',value:document.getElementById('set-cost-cur').value,label:'預設成本幣別'},
    {key:'default_quote_currency',value:document.getElementById('set-quote-cur').value,label:'預設報價幣別'},
    {key:'default_customer_review_days',value:String(customerReviewDays),label:'統一客戶回顧週期'},
    {key:'default_product_review_days',value:String(productReviewDays),label:'統一產品更新週期'},
    {key:'inquiry_warn_days',value:String(inquiryWarnDays),label:'詢價提醒天數'},
    {key:'inquiry_overdue_days',value:String(inquiryOverdueDays),label:'詢價超時天數'},
  ]
  await Promise.all(rows.map(r=>sb.from('settings').upsert({...r,updated_at:new Date().toISOString()})))
  await Promise.all([
    sb.from('customers').update({review_days:customerReviewDays}).neq('id',0),
    sb.from('products').update({review_days:productReviewDays}).neq('id',0)
  ])
  await Promise.all([loadSettings(),loadCustomers(),loadProducts()])
  renderSettingsTab()
  renderSettingsContent('modal-settings-bd')
  renderCustomers()
  renderProducts()
  updateCustomerReviewAlert()
  updateProductOverdueAlert()
  showToast('設定已儲存')
}

function nqeCalcMgn(idx){
  const it=_nqItems[idx]
  if(!it)return
  const cp=parseFloat(it.cost_price||0)
  const ac=document.getElementById('nqe-ac')?.checked&&supplierNeedsCustoms(it.supplier_id)
  const cpct=parseFloat(document.getElementById('nqe-cpct')?.value||0)
  const afterCustoms=ac?cp*(1+cpct/100):cp
  const fp=parseFloat(document.getElementById('nqe-fp')?.value||0)
  const mgn=afterCustoms>0&&fp?Math.round((fp/afterCustoms-1)*10000)/100:0
  const mc=mgn<5?'#e55':mgn<15?'#e88a00':'#0F6E56'
  const el=document.getElementById('nqe-mgn')
  if(el){el.style.color=mc;el.textContent=fp?'利潤率 '+mgn.toFixed(2)+'%':''}
}
function nqeCustomsChange(idx,checked){
  const it=_nqItems[idx]
  if(it&&!supplierNeedsCustoms(it.supplier_id))return
  nqeCalcMgn(idx)
}
function saveNqItemEdit(idx){
  const it=_nqItems[idx]
  if(!it)return
  const cp=parseFloat(it.cost_price||0)
  const ac=document.getElementById('nqe-ac')?.checked&&supplierNeedsCustoms(it.supplier_id)
  const cpct=parseFloat(document.getElementById('nqe-cpct')?.value||it.customs_fee_pct||7.5)
  const afterCustoms=ac?cp*(1+cpct/100):cp
  const fpVal=document.getElementById('nqe-fp')?.value
  const fp=fpVal?Math.round(parseFloat(fpVal)*100)/100:null
  const mgn=afterCustoms>0&&fp?Math.round((fp/afterCustoms-1)*10000)/100:null
  it.customs_fee_pct=cpct
  it.apply_customs=ac
  it.final_price=fp
  it.margin_pct=mgn
  it.customer_pricing_unit=document.getElementById('nqe-cpu')?.value||null
  it.moq=document.getElementById('nqe-moq')?.value||null
  it.lead_time=document.getElementById('nqe-lead')?.value||null
  document.getElementById('nq-item-edit-overlay')?.remove()
  renderNqItems()
}

async function submitNewQuote(){
  const customer=document.getElementById('nq-customer')?.value
  if(!customer){showToast('請選擇客戶','error');return}
  const supIds=[...new Set(_nqItems.map(it=>it.supplier_id).filter(Boolean))]
  const supplier=supIds.length===1?(suppliers.find(s=>s.id===supIds[0])?.company||null):null
  const notes=document.getElementById('nq-notes')?.value||null
  const now=new Date()
  const yy=now.getFullYear()
  const mm=String(now.getMonth()+1).padStart(2,'0')
  const dd=String(now.getDate()).padStart(2,'0')
  const seq=String(quoteHeaders.length+1).padStart(3,'0')
  const hId='QUO-D-'+yy+mm+dd+'-'+seq+'-v1'
  const{error}=await sb.from('quote_headers').insert({
    id:hId,inquiry_id:null,customer,supplier,version:1,status:'draft',notes,source:'direct'
  })
  if(error){showToast('建立失敗：'+error.message,'error');return}
  if(_nqItems.length){
    const itemsToInsert=_nqItems.map(it=>({
      header_id:hId,
      product:it.product,
      spec:it.spec||null,
      product_id:it.product_id||null,
      supplier_id:it.supplier_id||null,
      cost_price:it.cost_price||null,
      cost_currency:it.cost_currency||'USD',
      customs_fee_pct:it.customs_fee_pct??parseFloat(settings.default_customs_fee_pct||7.5),
      apply_customs:it.apply_customs??false,
      margin_pct:it.margin_pct??null,
      final_price:it.final_price??null,
      moq:it.moq||null,
      lead_time:it.lead_time||null,
      width_m:it.width_m||null,
      pricing_unit:it.pricing_unit||null,
      customer_pricing_unit:it.customer_pricing_unit||null
    }))
    const{error:e2}=await sb.from('quote_items').insert(itemsToInsert)
    if(e2){showToast('品項建立失敗：'+e2.message,'error');return}
  }
  await loadQuotes();closeModal('modal-new-quote');renderQuotes()
  logActivity('新增報價單','quote',hId,'')
  showToast('報價單 '+hId+' 已建立')
  setTimeout(()=>openQuoteModal(hId),300)
}

// ===== 庫存管理 =====
// 將採購品項數量轉為卷數。若品項已是卷（unit!='m'）直接回傳；
// 若為米且 prod.meters_per_roll 存在則換算；否則回傳 null（無法換算）。
function poQtyToRolls(qty,unit,prod){
  if(unit!=='m')return qty
  const mpr=parseFloat(prod.meters_per_roll)
  if(!mpr)return null
  return qty/mpr
}

async function saveInventoryAdjustments(){
  const tracked=products.filter(p=>p.min_stock_qty!=null&&p.min_stock_qty>0)
  const toUpdate=[]
  tracked.forEach(p=>{
    const adjInput=document.getElementById('inv-adj-'+p.id)
    const adj=parseFloat(adjInput?.value)
    if(!adjInput||isNaN(adj)||adj===0)return
    toUpdate.push({id:p.id,newQty:(parseFloat(p.stock_qty)||0)+adj,note:document.getElementById('inv-note-'+p.id)?.value?.trim()||null})
  })
  if(!toUpdate.length){showToast('沒有填入任何調整量');return}
  for(const u of toUpdate){
    const{error}=await sb.from('products').update({stock_qty:u.newQty}).eq('id',u.id)
    if(error){showToast('更新失敗：'+error.message,'error');return}
  }
  await loadProducts()
  renderProducts()
  renderDashboard()
  closeModal('modal-inventory')
  showToast('庫存已更新（'+toUpdate.length+' 項）')
}

async function saveProduct(id){
  const name=document.getElementById('pd-name').value.trim()
  if(!name){showToast('請填寫產品名稱','error');return}
  const newCost=parseFloat(document.getElementById('pd-cost').value)||null
  const newCurrency=document.getElementById('pd-currency').value
  const existing=id?products.find(x=>x.id===id):null
  const costChanged=!existing||(newCost!==existing.cost_price||newCurrency!==(existing.currency||''))
  const today=new Date().toISOString().slice(0,10)
  const data={
    product_name:name,
    supplier_id:parseInt(document.getElementById('pd-supplier').value)||null,
    cost_price:newCost,
    currency:newCurrency,
    review_days:(()=>{const preset=document.getElementById('pd-review-preset')?.value;return preset==='custom'?(parseInt(document.getElementById('pd-review-custom')?.value)||90):parseInt(preset)||90})(),
    last_reviewed_at:costChanged?today:(existing?.last_reviewed_at||today),
    notes:document.getElementById('pd-notes').value.trim()||null,
    is_active:document.getElementById('pd-active')?.checked!==false,

async function _createNewVersionWithUpdatedCost(headerId,productId,newCost,newCurrency){
  const h=quoteHeaders.find(x=>x.id===headerId);if(!h)return false
  const items=quoteItems.filter(it=>it.header_id===h.id)
  const newV=h.version+1
  const newId=h.id.replace(/-v\d+$/,'')+'-v'+newV
  const{error}=await sb.from('quote_headers').insert({
    id:newId,inquiry_id:h.inquiry_id||null,customer:h.customer,supplier:h.supplier,version:newV,status:'draft',notes:h.notes,source:h.source||null
  })
  if(error)return false
  if(items.length){
    const newItems=items.map(({id:_,...rest})=>({
      ...rest,header_id:newId,
      cost_price:rest.product_id===productId?newCost:rest.cost_price,
      cost_currency:rest.product_id===productId?newCurrency:rest.cost_currency
    }))
    const{error:e2}=await sb.from('quote_items').insert(newItems)
    if(e2)return false
  }
  await sb.from('quote_headers').update({status:'superseded'}).eq('id',h.id)
  return true
}

async function createVersionsForChecked(productId,newCost,newCurrency){
  const checked=[...document.querySelectorAll('.cost-impact-check:checked')].map(el=>el.dataset.hid)
  if(!checked.length){showToast('請至少勾選一張報價單','warn');return}
  let count=0
  for(const hid of checked){
    const ok=await _createNewVersionWithUpdatedCost(hid,productId,newCost,newCurrency)
    if(ok)count++
  }
  await loadQuotes()
  await _finishSaveProduct('已為 '+count+' 張報價單產生新版本')
  switchTab('quotes')
}

function customerStatus(c){
  const reviewDays=getCustomerReviewDays()
  if(!c.last_reviewed_at||!reviewDays)return 'ok'
  const last=new Date(c.last_reviewed_at)
  const daysSince=Math.floor((new Date()-last)/(1000*60*60*24))
  if(daysSince>=reviewDays)return 'overdue'
  if(daysSince>=reviewDays*0.8)return 'warn'
  return 'ok'
}
function customerDaysLeft(c){
  const reviewDays=getCustomerReviewDays()
  if(!c.last_reviewed_at||!reviewDays)return null
  const last=new Date(c.last_reviewed_at)
  const daysSince=Math.floor((new Date()-last)/(1000*60*60*24))
  return reviewDays-daysSince
}
function updateCustomerReviewAlert(){
  const el=document.getElementById('customer-review-alert')

}

  if(sum)sum.textContent=companyEntries.length+' 家客戶 / '+customers.length+' 位聯絡人'
  updateCustomerReviewAlert()
  if(!customers.length){el.innerHTML='<div class="loading">尚無客戶資料</div>';return}
  el.innerHTML=companyEntries.map(([company,people])=>{
    const primary=people[0]
    const st=customerStatus(primary)
    const daysLeft=customerDaysLeft(primary)
    const stBg=st==='overdue'?'#FCEBEB':st==='warn'?'#FFFBEA':'transparent'
    const stColor=st==='overdue'?'#A32D2D':st==='warn'?'#7A5B00':null
    const stLabel=st==='overdue'?'需回顧':st==='warn'?'即將到期':null

      '<span>'+company+'</span><span style="font-size:11px;color:#888">'+people.length+' 位聯絡人</span></div>'+
      people.map(c=>
        '<div class="row '+(st==='overdue'?'overdue':st==='warn'?'warning':'')+'" style="align-items:flex-start;margin-bottom:0;border:none;padding:7px 0;cursor:pointer" onclick="openEditCustomer('+c.id+')">'+
        '<div style="flex:1;min-width:0">'+

async function saveCustomer(id){
  const current=customers.find(x=>x.id===id)
  if(!current)return
  const name=document.getElementById('ec-name').value.trim()
  const company=document.getElementById('ec-company').value.trim()
  if(!name||!company){showToast('請填寫姓名和公司','error');return}
  const {error:updateError}=await sb.from('customers').update({name,company,
    email:document.getElementById('ec-email').value.trim()||null,
    phone:document.getElementById('ec-phone').value.trim()||null,
    country:document.getElementById('ec-country').value,
    industry:document.getElementById('ec-industry').value.trim()||null,
    notes:document.getElementById('ec-notes').value.trim()||null,
    review_days:getCustomerReviewDays(),
    last_reviewed_at:document.getElementById('ec-reviewed')?.value||null}).eq('id',id)
  if(updateError){showToast('儲存客戶失敗：'+updateError.message,'error');return}
  if(company!==current.company){
    const syncResults=await Promise.all([
      sb.from('customers').update({company}).eq('company',current.company).neq('id',id),
      sb.from('inquiries').update({customer:company}).eq('customer',current.company),
      sb.from('quote_headers').update({customer:company}).eq('customer',current.company),
      sb.from('orders').update({customer:company}).eq('customer',current.company)
    ])
    const syncError=syncResults.find(r=>r.error)?.error
    if(syncError){showToast('客戶名稱同步失敗：'+syncError.message,'error');return}
  }
  _isDirty=false
  await loadCustomers();closeModal('modal-customer');renderCustomers()
  logActivity('更新客戶','customer',String(id),'')
  showToast('客戶已更新')
}

async function saveUserDetail(userId){
  const u=users.find(x=>x.id===userId)
  if(!u)return
  const isSelf=currentUser&&currentUser.id===u.id
  const isManager=currentUser&&(currentUser.role==='admin'||currentUser.role==='manager')
  const name=document.getElementById('ud-name')?.value.trim()
  const email=document.getElementById('ud-email')?.value.trim()
  if(!name||!email){showToast('請填寫姓名與 Email','error');return}
  const patch={name,email}
  if(isManager&&!isSelf){
    patch.role=normalizeUserRole(document.getElementById('ud-role')?.value)
    patch.is_active=!!document.getElementById('ud-active')?.checked
  }
  const{error}=await sb.from('users').update(patch).eq('id',userId)
  if(error){showToast('儲存失敗：'+error.message,'error');return}
  if(isSelf)persistCurrentUser({...currentUser,...patch})
  await loadUsers()
  if(isSelf&&currentUser){
    document.getElementById('user-info').textContent=currentUser.name+' ('+userRoleLabel(currentUser.role)+')'
    document.getElementById('sidebar-user-email').textContent=currentUser.email||currentUser.name||'已登入'
  }
  openUserDetail(userId)
  renderUsersMgmt()
  showToast('使用者資料已更新')
}

    '</div>'+

  document.getElementById('modal-change-pwd').classList.add('open')

async function submitChangePassword(){
  const cur=document.getElementById('cp-current')?.value||''
  const newPwd=document.getElementById('cp-new')?.value||''
  const confirm=document.getElementById('cp-confirm')?.value||''
  if(!cur||!newPwd||!confirm){showToast('請填寫所有欄位','error');return}
  let currentPassword=currentUser?.password_hash
  if(!currentPassword){
    const{data,error:fetchError}=await sb.from('users').select('password_hash').eq('id',currentUser.id).maybeSingle()
    if(fetchError){showToast('驗證目前密碼失敗：'+fetchError.message,'error');return}
    currentPassword=data?.password_hash||''
  }
  if(cur!==currentPassword){showToast('目前密碼不正確','error');return}
  if(newPwd!==confirm){showToast('新密碼與確認密碼不一致','error');return}
  if(newPwd.length<4){showToast('密碼至少需要 4 個字元','error');return}
  const{error}=await sb.from('users').update({password_hash:newPwd}).eq('id',currentUser.id)
  if(error){showToast('更新失敗：'+error.message,'error');return}
  persistCurrentUser({...currentUser,password_hash:newPwd})
  await loadUsers()
  closeModal('modal-change-pwd')
  showToast('密碼已更新')
}

let activityLogs=[]
async function loadActivityLogs(){
  const{data}=await sb.from('activity_logs').select('*').order('created_at',{ascending:false}).limit(200)
  activityLogs=data||[]
  const names=[...new Set(activityLogs.map(l=>l.user_name).filter(Boolean))].sort()
  const sel=document.getElementById('al-user')
  if(sel){const cur=sel.value;sel.innerHTML='<option value="">全部使用者</option>'+names.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('');sel.value=cur}
  renderActivityLogs()
}
function renderActivityLogs(){
  const el=document.getElementById('activity-log-list')
  if(!el)return
  const fUser=document.getElementById('al-user')?.value||''
  const fModule=document.getElementById('al-module')?.value||''
  const fFrom=document.getElementById('al-date-from')?.value||''
  const fTo=document.getElementById('al-date-to')?.value||''
  const filtered=activityLogs.filter(l=>{
    if(fUser&&l.user_name!==fUser)return false
    if(fModule&&l.module!==fModule)return false
    const d=(l.created_at||'').slice(0,10)
    if(fFrom&&d<fFrom)return false
    if(fTo&&d>fTo)return false
    return true
  })
  if(!filtered.length){el.innerHTML='<div class="loading">沒有符合條件的記錄</div>';return}
  el.innerHTML=filtered.map(l=>{
    const dt=new Date(l.created_at)
    const ts=String(dt.getMonth()+1).padStart(2,'0')+'/'+String(dt.getDate()).padStart(2,'0')+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0')
    return '<div class="row" style="display:flex;align-items:center;gap:8px;cursor:default;flex-wrap:wrap">'+
      '<span style="font-size:11px;color:#aaa;font-family:monospace;white-space:nowrap">'+ts+'</span>'+
      '<span style="font-size:12px;font-weight:500;white-space:nowrap">'+esc(l.user_name||'—')+'</span>'+
      '<span style="font-size:11px;color:#666;background:#f0f0eb;padding:1px 6px;border-radius:4px;white-space:nowrap">'+esc(l.module||'')+'</span>'+
      '<span style="font-size:12px">'+esc(l.action||'')+'</span>'+
      (l.ref_id?'<span style="font-size:11px;color:#888;font-family:monospace">'+esc(l.ref_id)+'</span>':'')+
      (l.detail?'<span style="font-size:11px;color:#999">'+esc(l.detail)+'</span>':'')+
      '</div>'
  }).join('')
}

    '<div><label>國家 <span class="req">*</span></label><select id="es-country">'+buildOptionPairs(COUNTRY_OPTION_PAIRS,getSupplierCountryValue(s.id))+'</select></div>'+
    '<div><label>職務</label><input id="es-role" value="'+(s.role||'')+'" /></div>'+
    '<div><label>Email <span class="req">*</span></label><input id="es-email" value="'+(s.email||'')+'" /></div>'+
    '<div><label>電話</label><input id="es-phone" value="'+(s.phone||'')+'" /></div>'+
    '<div><label>LINE ID</label><input id="es-line" value="'+(s.line_id||'')+'" /></div>'+
    '<div><label>WhatsApp</label><input id="es-whatsapp" value="'+(s.whatsapp||'')+'" /></div>'+
    '<div><label>專長產品</label><input id="es-specialty" value="'+(s.specialty||'')+'" /></div>'+
    '<div><label>郵件稱謂</label><input id="es-salutation" value="'+(s.salutation||'')+'" placeholder="例：王哥、李總、David" /></div>'+
    '</div><div class="modal-foot"><button class="btn btn-primary" onclick="saveSupplier('+id+')">儲存</button><button class="btn btn-ghost" onclick="openNewSupplierContact('+id+')">＋ 新增同公司聯絡人</button></div>'
  enableDirtyTracking('modal-supplier-bd')
  document.getElementById('modal-supplier').classList.add('open')
}

async function saveSupplier(id){
  const current=suppliers.find(x=>x.id===id)
  if(!current)return
  const name=document.getElementById('es-name').value.trim()
  const company=document.getElementById('es-company').value.trim()
  const email=document.getElementById('es-email').value.trim()
  const country=document.getElementById('es-country').value
  if(!name||!company||!email||!country){showToast('請填寫姓名、公司、國家和 Email','error');return}
  const {error:updateError}=await sb.from('suppliers').update({name,company,email,
    country,
    role:document.getElementById('es-role').value.trim()||null,
    phone:document.getElementById('es-phone').value.trim()||null,
    line_id:document.getElementById('es-line').value.trim()||null,
    whatsapp:document.getElementById('es-whatsapp').value.trim()||null,
    specialty:document.getElementById('es-specialty').value.trim()||null,
    salutation:document.getElementById('es-salutation').value.trim()||null}).eq('id',id)
  if(updateError){showToast('儲存供應商失敗：'+updateError.message,'error');return}
  if(company!==current.company){
    const syncResults=await Promise.all([
      sb.from('suppliers').update({company}).eq('company',current.company).neq('id',id),
      sb.from('inquiries').update({supplier:company}).eq('supplier',current.company),
      sb.from('quote_headers').update({supplier:company}).eq('supplier',current.company)
    ])
    const syncError=syncResults.find(r=>r.error)?.error
    if(syncError){showToast('供應商名稱同步失敗：'+syncError.message,'error');return}
  }
  _isDirty=false
  await loadSuppliers();closeModal('modal-supplier');renderSupplierMgmt()
  logActivity('更新供應商','supplier',String(id),'')
  showToast('供應商資料已儲存')
}

// ===== 技術文件庫 =====
function renderDocs(){
  const q=(document.getElementById('doc-search')?.value||'').toLowerCase()
  const filtered=documents.filter(d=>!q||d.product?.toLowerCase().includes(q)||d.doc_type?.toLowerCase().includes(q)||(d.tags||[]).some(t=>t.toLowerCase().includes(q)))
  const prods=[...new Set(filtered.map(d=>d.product))]
  let html=''
  if(!prods.length)html='<div class="loading">找不到相關文件</div>'
  prods.forEach(p=>{
    html+='<div style="font-size:12px;font-weight:500;color:#666;margin:14px 0 6px;padding-bottom:5px;border-bottom:1px solid #e5e5e0">'+escapeHtml(p)+'</div>'
    filtered.filter(d=>d.product===p).forEach(doc=>{
      html+='<div class="doc-row"><div class="pdf-icon">PDF</div>'+
        '<div style="flex:1"><div style="font-size:12px;font-weight:500">'+escapeHtml(doc.doc_type||'')+'</div><div style="font-size:10px;color:#aaa">'+escapeHtml(doc.file_size||'')+'</div></div>'+
        '<div>'+(doc.tags||[]).map(t=>'<span class="tag">'+escapeHtml(t)+'</span>').join('')+'</div>'+
        '<button class="btn btn-ghost btn-sm btn-doc-copy" onclick="copyDocLink('+JSON.stringify(doc.file_url||'#')+','+JSON.stringify(doc.doc_type||'文件')+')">複製連結</button></div>'
    })
  })
  document.getElementById('doc-list').innerHTML=html
}

function copyDocLink(url,name){
  navigator.clipboard.writeText(url)
    .then(()=>showToast('已複製：'+name+' 的連結'))
    .catch(()=>showToast('請手動複製','error'))
}

checkAuth()
if(typeof lucide!=='undefined')lucide.createIcons()
