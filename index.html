function customerStatus(c){
  const reviewDays=getCustomerReviewDays()
  if(!c.last_reviewed_at||!reviewDays)return 'ok'
  const last=new Date(c.last_reviewed_at)
  const daysSince=Math.floor((new Date()-last)/(1000*60*60*24))
  if(daysSince>=reviewDays)return 'overdue'
  if(daysSince>=reviewDays*0.8)return 'warn'
  return 'ok'
}
function customerDaysLeft(c){
  const reviewDays=getCustomerReviewDays()
  if(!c.last_reviewed_at||!reviewDays)return null
  const last=new Date(c.last_reviewed_at)
  const daysSince=Math.floor((new Date()-last)/(1000*60*60*24))
  return reviewDays-daysSince
}
function updateCustomerReviewAlert(){
  const el=document.getElementById('customer-review-alert')
  if(!el)return
  const overdue=customers.filter(c=>customerStatus(c)==='overdue')
  if(overdue.length){
    el.style.display='block'
    el.textContent='⚠️ '+overdue.length+' 位客戶需要回顧：'+overdue.map(c=>c.company).join('、')
  } else {
    el.style.display='none'
  }
}
function renderCustomers(){
  const el=document.getElementById('customer-list')
  const sum=document.getElementById('customer-summary')
  if(!el)return
  const companyEntries=Object.entries(customers.reduce((acc,c)=>{if(!acc[c.company])acc[c.company]=[];acc[c.company].push(c);return acc},{}))
  if(sum)sum.textContent=companyEntries.length+' 家客戶 / '+customers.length+' 位聯絡人'
  updateCustomerReviewAlert()
  if(!customers.length){el.innerHTML='<div class="loading">尚無客戶資料</div>';return}
  el.innerHTML=companyEntries.map(([company,people])=>{
    const primary=people[0]
    const st=customerStatus(primary)
    const daysLeft=customerDaysLeft(primary)
    const stBg=st==='overdue'?'#FCEBEB':st==='warn'?'#FFFBEA':'transparent'
    const stColor=st==='overdue'?'#A32D2D':st==='warn'?'#7A5B00':null
    const stLabel=st==='overdue'?'需回顧':st==='warn'?'即將到期':null
    return '<div class="card" style="margin-bottom:10px">'+
      '<div style="font-size:13px;font-weight:500;color:#1a1a1a;margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid #e5e5e0;cursor:pointer;display:flex;justify-content:space-between;align-items:center" onclick="openEditCustomer('+primary.id+')">'+
      '<span>'+company+'</span><span style="font-size:11px;color:#888">'+people.length+' 位聯絡人</span></div>'+
      people.map(c=>
        '<div class="row '+(st==='overdue'?'overdue':st==='warn'?'warning':'')+'" style="align-items:flex-start;margin-bottom:0;border:none;padding:7px 0;cursor:pointer" onclick="openEditCustomer('+c.id+')">'+
        '<div style="flex:1;min-width:0">'+
        '<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:3px">'+
        '<span style="font-size:12px;font-weight:500">'+c.name+'</span>'+
        '<span class="tag">'+(c.country||'—')+'</span>'+
        (c.industry?'<span class="tag">'+c.industry+'</span>':'')+
        (stLabel&&c.id===primary.id?'<span class="badge" style="background:'+stBg+';color:'+stColor+'">'+stLabel+'</span>':'')+
        '</div>'+
        '<div style="font-size:11px;color:#666">'+[c.email,c.phone].filter(Boolean).join(' · ')+'</div>'+
        (c.notes?'<div style="font-size:11px;color:#aaa;margin-top:2px">'+c.notes+'</div>':'')+
        (c.last_reviewed_at&&c.id===primary.id?'<div style="font-size:11px;color:#aaa;margin-top:2px">上次回顧：'+c.last_reviewed_at+(daysLeft!==null?' · '+(daysLeft>0?'剩 '+daysLeft+' 天':'已過 '+Math.abs(daysLeft)+' 天'):'')+'</div>':'')+
        '</div>'+
        '<div style="display:flex;gap:6px;flex-shrink:0">'+
        '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openEditCustomer('+c.id+')">詳情</button>'+
        '<button class="btn btn-ghost btn-sm" style="color:#aaa" onclick="event.stopPropagation();deleteCustomer('+c.id+',\''+c.name+'\')">×</button>'+
        '</div></div>'
      ).join('')+
    '</div>'
  }).join('')
}

async function saveCustomer(id){
  const current=customers.find(x=>x.id===id)
  if(!current)return
  const name=document.getElementById('ec-name').value.trim()
  const company=document.getElementById('ec-company').value.trim()
  if(!name||!company){showToast('請填寫姓名和公司','error');return}
  const {error:updateError}=await sb.from('customers').update({name,company,
    email:document.getElementById('ec-email').value.trim()||null,
    phone:document.getElementById('ec-phone').value.trim()||null,
    country:document.getElementById('ec-country').value,
    industry:document.getElementById('ec-industry').value.trim()||null,
    notes:document.getElementById('ec-notes').value.trim()||null,
    review_days:getCustomerReviewDays(),
    last_reviewed_at:document.getElementById('ec-reviewed')?.value||null}).eq('id',id)
  if(updateError){showToast('儲存客戶失敗：'+updateError.message,'error');return}
  if(company!==current.company){
    const syncResults=await Promise.all([
      sb.from('customers').update({company}).eq('company',current.company).neq('id',id),
      sb.from('inquiries').update({customer:company}).eq('customer',current.company),
      sb.from('quote_headers').update({customer:company}).eq('customer',current.company),
      sb.from('orders').update({customer:company}).eq('customer',current.company)
    ])
    const syncError=syncResults.find(r=>r.error)?.error
    if(syncError){showToast('客戶名稱同步失敗：'+syncError.message,'error');return}
  }
  _isDirty=false
  await loadCustomers();closeModal('modal-customer');renderCustomers()
  showToast('客戶已更新')
}

      '<option value="manager"'+(u.role==='manager'?' selected':'')+'>經理</option>'+

      '<input id="ud-active" type="checkbox" '+(u.is_active?'checked ':'')+(isManager&&!isSelf?'':'disabled ')+'style="display:none" onchange="_isDirty=true;document.getElementById(\'ud-active-track\').style.background=this.checked?\'#0F6E56\':\'#d8d8d2\';document.getElementById(\'ud-active-knob\').style.transform=this.checked?\'translateX(18px)\':\'translateX(0)\';document.getElementById(\'ud-active-text\').textContent=this.checked?\'啟用\':\'停用\'" />'+

async function saveUserDetail(userId){
  const u=users.find(x=>x.id===userId)
  if(!u)return
  const isSelf=currentUser&&currentUser.id===u.id
  const isManager=currentUser&&(currentUser.role==='admin'||currentUser.role==='manager')
  const name=document.getElementById('ud-name')?.value.trim()
  const email=document.getElementById('ud-email')?.value.trim()
  if(!name||!email){showToast('請填寫姓名與 Email','error');return}
  const patch={name,email}
  if(isManager&&!isSelf){
    patch.role=normalizeUserRole(document.getElementById('ud-role')?.value)
    patch.is_active=!!document.getElementById('ud-active')?.checked
  }
  const{error}=await sb.from('users').update(patch).eq('id',userId)
  if(error){showToast('儲存失敗：'+error.message,'error');return}
  if(isSelf)persistCurrentUser({...currentUser,...patch})
  await loadUsers()
  if(isSelf&&currentUser){
    document.getElementById('user-info').textContent=currentUser.name+' ('+userRoleLabel(currentUser.role)+')'
    document.getElementById('sidebar-user-email').textContent=currentUser.email||currentUser.name||'已登入'
  }
  openUserDetail(userId)
  renderUsersMgmt()
  showToast('使用者資料已更新')
}

function openChangePassword(){
  closeModal('modal-user-detail')
  document.getElementById('modal-change-pwd-bd').innerHTML=
    '<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">'+
    '<div><label>目前密碼</label><input type="password" id="cp-current" placeholder="目前密碼" /></div>'+
    '<div><label>新密碼</label><input type="password" id="cp-new" placeholder="新密碼" /></div>'+
    '<div><label>確認新密碼</label><input type="password" id="cp-confirm" placeholder="再次輸入新密碼" /></div>'+
    '</div>'+
    '<div class="modal-foot">'+
    '<button class="btn btn-primary" onclick="submitChangePassword()">儲存</button>'+
    '<button class="btn btn-ghost" onclick="closeModal(\'modal-change-pwd\')">取消</button>'+
    '</div>'
  document.getElementById('modal-change-pwd').classList.add('open')
}

async function submitChangePassword(){
  const cur=document.getElementById('cp-current')?.value||''
  const newPwd=document.getElementById('cp-new')?.value||''
  const confirm=document.getElementById('cp-confirm')?.value||''
  if(!cur||!newPwd||!confirm){showToast('請填寫所有欄位','error');return}
  let currentPassword=currentUser?.password_hash
  if(!currentPassword){
    const{data,error:fetchError}=await sb.from('users').select('password_hash').eq('id',currentUser.id).maybeSingle()
    if(fetchError){showToast('驗證目前密碼失敗：'+fetchError.message,'error');return}
    currentPassword=data?.password_hash||''
  }
  if(cur!==currentPassword){showToast('目前密碼不正確','error');return}
  if(newPwd!==confirm){showToast('新密碼與確認密碼不一致','error');return}
  if(newPwd.length<4){showToast('密碼至少需要 4 個字元','error');return}
  const{error}=await sb.from('users').update({password_hash:newPwd}).eq('id',currentUser.id)
  if(error){showToast('更新失敗：'+error.message,'error');return}
  persistCurrentUser({...currentUser,password_hash:newPwd})
  await loadUsers()
  closeModal('modal-change-pwd')
  showToast('密碼已更新')
}

async function submitResetUserPassword(){
  const newPwd=(document.getElementById('rp-new')?.value||'').trim()
  if(!newPwd){showToast('請輸入新密碼','error');return}
  if(newPwd.length<4){showToast('密碼至少需要 4 個字元','error');return}
  const{error}=await sb.from('users').update({password_hash:newPwd}).eq('id',_resetPwdUserId)
  if(error){showToast('重設失敗：'+error.message,'error');return}
  await loadUsers()
  closeModal('modal-reset-pwd')
  showToast('密碼已重設')
}

async function toggleUserActive(userId,currentActive){
  const action=currentActive?'停用':'啟用'
  confirmModal('確定要'+action+'此使用者嗎？',async()=>{
    const{error}=await sb.from('users').update({is_active:!currentActive}).eq('id',userId)
    if(error){showToast(action+'失敗：'+error.message,'error');return}
    await loadUsers()
    renderUsersMgmt()
    showToast('已'+action)
  })
}

async function deleteUser(userId,userName){
  confirmModal('確定要刪除使用者「'+userName+'」嗎？',async()=>{
    const{error}=await sb.from('users').delete().eq('id',userId)
    if(error){showToast('刪除失敗：'+error.message,'error');return}
    await loadUsers()
    renderUsersMgmt()
    showToast('已刪除')
  })
}

function renderUsersMgmt(){
  const el=document.getElementById('user-list')
  const sum=document.getElementById('user-summary')
  if(!el)return
  
  if(sum)sum.textContent=users.length+' 位使用者'
  
  if(!users.length){
    el.innerHTML='<div class="loading">尚無使用者資料</div>'
    return
  }
  
  el.innerHTML=users.map(u=>{
    const roleBadge='<span class="badge" style="background:'+userRoleColor(u.role)+'20;color:'+userRoleColor(u.role)+';border:1px solid '+userRoleColor(u.role)+'">'+userRoleLabel(u.role)+'</span>'
    const statusBadge=u.is_active?'<span class="badge" style="background:#E1F5EE;color:#085041;border:1px solid #0F6E56">啟用</span>':'<span class="badge" style="background:#FCEBEB;color:#A32D2D;border:1px solid #F09595">停用</span>'
    const isSelf=currentUser&&currentUser.id===u.id
    return '<div class="card" style="margin-bottom:8px;display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer" onclick="openUserDetail('+u.id+')">'+
      '<div style="flex:1;min-width:0">'+
        '<div style="font-size:13px;font-weight:500">'+u.name+(isSelf?' <span style="font-size:10px;color:#888">（我）</span>':'')+'</div>'+
        '<div style="font-size:11px;color:#888">'+u.email+'</div>'+
      '</div>'+
      roleBadge+statusBadge+
      '<span style="color:#ccc;font-size:14px">›</span>'+
    '</div>'
  }).join('')
}

function renderSupplierMgmt(){
  const el=document.getElementById('supplier-mgmt-list')
  const sum=document.getElementById('supplier-summary')
  if(!el)return
  const companyEntries=Object.entries(suppliers.reduce((acc,s)=>{if(!acc[s.company])acc[s.company]=[];acc[s.company].push(s);return acc},{}))
  if(sum)sum.textContent=companyEntries.length+' 家供應商 / '+suppliers.length+' 位聯絡人'
  if(!suppliers.length){el.innerHTML='<div class="loading">尚無供應商資料</div>';return}
  const cos={}
  suppliers.forEach(s=>{if(!cos[s.company])cos[s.company]=[];cos[s.company].push(s)})
  el.innerHTML=Object.entries(cos).map(([company,people])=>
    '<div class="card" style="margin-bottom:10px">'+
    '<div style="font-size:13px;font-weight:500;color:#1a1a1a;margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid #e5e5e0;cursor:pointer;display:flex;justify-content:space-between;align-items:center" onclick="openEditSupplier('+people[0].id+')"><span>'+company+'</span><span style="font-size:11px;color:#888">'+people.length+' 位聯絡人</span></div>'+
    people.map(s=>'<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f5f5f0;cursor:pointer" onclick="openEditSupplier('+s.id+')">'+
      '<div style="flex:1;min-width:0">'+
      '<div style="font-size:12px;font-weight:500;color:#333">'+s.name+(s.role?' <span style="font-size:10px;color:#aaa;font-weight:400">· '+s.role+'</span>':'')+'</div>'+
      '<div style="font-size:11px;color:#aaa;margin-top:1px">'+[s.email,s.phone,s.specialty].filter(Boolean).join(' · ')+'</div>'+
      '</div>'+
      '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openEditSupplier('+s.id+')">詳情</button>'+
      '<button style="background:none;border:none;color:#ccc;cursor:pointer;font-size:16px;padding:0" onclick="event.stopPropagation();deleteSupplier('+s.id+',\''+s.name+'\')">×</button>'+
      '</div>').join('')+

    '<div><label>郵件稱謂</label><input id="es-salutation" value="'+(s.salutation||'')+'" placeholder="例：王哥、李總、David" /></div>'+
    '</div><div class="modal-foot"><button class="btn btn-primary" onclick="saveSupplier('+id+')">儲存</button><button class="btn btn-ghost" onclick="openNewSupplierContact('+id+')">＋ 新增同公司聯絡人</button></div>'

  document.getElementById('modal-supplier').classList.add('open')

async function saveSupplier(id){
  const current=suppliers.find(x=>x.id===id)
  if(!current)return
  const name=document.getElementById('es-name').value.trim()
  const company=document.getElementById('es-company').value.trim()
  const email=document.getElementById('es-email').value.trim()
  const country=document.getElementById('es-country').value
  if(!name||!company||!email||!country){showToast('請填寫姓名、公司、國家和 Email','error');return}
  const {error:updateError}=await sb.from('suppliers').update({name,company,email,
    country,
    role:document.getElementById('es-role').value.trim()||null,
    phone:document.getElementById('es-phone').value.trim()||null,
    line_id:document.getElementById('es-line').value.trim()||null,
    whatsapp:document.getElementById('es-whatsapp').value.trim()||null,
    specialty:document.getElementById('es-specialty').value.trim()||null,
    salutation:document.getElementById('es-salutation').value.trim()||null}).eq('id',id)
  if(updateError){showToast('儲存供應商失敗：'+updateError.message,'error');return}
  if(company!==current.company){
    const syncResults=await Promise.all([
      sb.from('suppliers').update({company}).eq('company',current.company).neq('id',id),
      sb.from('inquiries').update({supplier:company}).eq('supplier',current.company),
      sb.from('quote_headers').update({supplier:company}).eq('supplier',current.company)
    ])
    const syncError=syncResults.find(r=>r.error)?.error
    if(syncError){showToast('供應商名稱同步失敗：'+syncError.message,'error');return}
  }
  _isDirty=false
  await loadSuppliers();closeModal('modal-supplier');renderSupplierMgmt();showToast('供應商資料已儲存')
}

// ===== 技術文件庫 =====
function renderDocs(){
  const q=(document.getElementById('doc-search')?.value||'').toLowerCase()
  const filtered=documents.filter(d=>!q||d.product?.toLowerCase().includes(q)||d.doc_type?.toLowerCase().includes(q)||(d.tags||[]).some(t=>t.toLowerCase().includes(q)))
  const prods=[...new Set(filtered.map(d=>d.product))]
  let html=''
  if(!prods.length)html='<div class="loading">找不到相關文件</div>'
  prods.forEach(p=>{
    html+='<div style="font-size:12px;font-weight:500;color:#666;margin:14px 0 6px;padding-bottom:5px;border-bottom:1px solid #e5e5e0">'+escapeHtml(p)+'</div>'
    filtered.filter(d=>d.product===p).forEach(doc=>{
      html+='<div class="doc-row"><div class="pdf-icon">PDF</div>'+
        '<div style="flex:1"><div style="font-size:12px;font-weight:500">'+escapeHtml(doc.doc_type||'')+'</div><div style="font-size:10px;color:#aaa">'+escapeHtml(doc.file_size||'')+'</div></div>'+
        '<div>'+(doc.tags||[]).map(t=>'<span class="tag">'+escapeHtml(t)+'</span>').join('')+'</div>'+
        '<button class="btn btn-ghost btn-sm btn-doc-copy" onclick="copyDocLink('+JSON.stringify(doc.file_url||'#')+','+JSON.stringify(doc.doc_type||'文件')+')">複製連結</button></div>'
    })
  })
  document.getElementById('doc-list').innerHTML=html
}

function copyDocLink(url,name){
  navigator.clipboard.writeText(url)
    .then(()=>showToast('已複製：'+name+' 的連結'))
    .catch(()=>showToast('請手動複製','error'))
}
