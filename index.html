<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOY CHIN PSA — 業務系統</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; display: flex; }
.sidebar { width: 210px; min-height: 100vh; background: #1a1a1a; flex-shrink: 0; display: flex; flex-direction: column; }
.sidebar-logo { padding: 20px 18px 16px; border-bottom: 1px solid #2a2a2a; }
.sidebar-logo h1 { font-size: 13px; font-weight: 600; color: #fff; line-height: 1.4; }
.sidebar-logo p { font-size: 10px; color: #555; margin-top: 3px; }
.sidebar-nav { flex: 1; padding: 10px 0; }
.nav-section { font-size: 10px; color: #444; padding: 10px 18px 4px; letter-spacing: 0.8px; text-transform: uppercase; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 9px 18px; font-size: 12px; color: #777; cursor: pointer; border: none; background: none; width: 100%; text-align: left; transition: all 0.12s; }
.nav-item:hover { color: #fff; background: #242424; }
.nav-item.active { color: #fff; background: #0F6E56; }
.nav-icon { font-size: 14px; width: 16px; text-align: center; flex-shrink: 0; }
.sidebar-footer { padding: 14px 18px; border-top: 1px solid #242424; font-size: 10px; color: #444; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
.topbar { background: #fff; border-bottom: 1px solid #e5e5e0; padding: 13px 24px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.topbar-title { font-size: 14px; font-weight: 600; color: #1a1a1a; }
.content { padding: 20px 24px; }
.card { background: #fff; border-radius: 12px; padding: 18px 20px; border: 1px solid #e5e5e0; margin-bottom: 14px; }
.btn { padding: 7px 14px; border-radius: 8px; border: none; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.12s; }
.btn-primary { background: #0F6E56; color: #fff; }
.btn-primary:hover { background: #085041; }
.btn-blue { background: #185FA5; color: #fff; }
.btn-ghost { background: transparent; color: #666; border: 1px solid #e5e5e0; }
.btn-ghost:hover { background: #f5f5f0; }
.btn-sm { padding: 4px 10px; font-size: 11px; }
input, select, textarea { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid #e5e5e0; font-size: 12px; color: #1a1a1a; background: #fff; font-family: inherit; transition: border 0.12s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: #0F6E56; }
textarea { resize: vertical; min-height: 72px; }
label { font-size: 11px; color: #666; display: block; margin-bottom: 4px; }
.req { color: #A32D2D; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 500; }
.overdue-tag { color: #A32D2D; font-size: 11px; font-weight: 500; }
.row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid #e5e5e0; border-radius: 10px; cursor: pointer; margin-bottom: 7px; background: #fff; transition: all 0.12s; }
.row:hover { border-color: #0F6E56; background: #f8fffc; }
.row.overdue { border-color: #F09595; background: #FCEBEB; }
.status-btns { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0; }
.status-btn { padding: 3px 10px; border-radius: 7px; font-size: 11px; font-weight: 500; cursor: pointer; border: 1px solid; }
.divider { height: 1px; background: #e5e5e0; margin: 14px 0; }
.section-title { font-size: 12px; font-weight: 500; color: #444; margin-bottom: 8px; }
.alert-info { background: #E6F1FB; border: 1px solid #B5D4F4; color: #0C447C; padding: 9px 13px; border-radius: 8px; font-size: 12px; margin-bottom: 12px; }
.loading { text-align: center; padding: 40px; color: #aaa; font-size: 13px; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 7px; font-size: 10px; background: #f0f0eb; color: #666; border: 1px solid #e5e5e0; margin: 1px; }
.doc-row { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border: 1px solid #e5e5e0; border-radius: 8px; background: #fff; margin-bottom: 5px; }
.pdf-icon { width: 30px; height: 30px; border-radius: 6px; background: #FCEBEB; border: 1px solid #F7C1C1; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #791F1F; flex-shrink: 0; }
.tpl-box { background: #f8f8f5; border: 1px solid #e5e5e0; border-radius: 9px; padding: 13px 15px; font-size: 11px; line-height: 1.8; white-space: pre-wrap; font-family: monospace; color: #1a1a1a; }
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.filter-bar select, .filter-bar input[type=text], .filter-bar input[type=date] { width: auto; font-size: 12px; padding: 6px 10px; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
.modal-overlay.open { display: flex; }
.modal-box { background: #fff; border-radius: 14px; width: 100%; max-width: 600px; max-height: 88vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.15); display: flex; flex-direction: column; }
.modal-box.sm { max-width: 440px; }
.modal-hd { display: flex; justify-content: space-between; align-items: flex-start; padding: 18px 20px 12px; position: sticky; top: 0; background: #fff; border-bottom: 1px solid #e5e5e0; border-radius: 14px 14px 0 0; z-index: 1; }
.modal-bd { padding: 16px 20px 20px; }
.modal-close { background: none; border: none; font-size: 20px; color: #aaa; cursor: pointer; padding: 0; flex-shrink: 0; line-height: 1; }
@media (max-width: 680px) { .sidebar { width: 48px; } .sidebar-logo p, .nav-item span, .nav-section, .sidebar-footer { display: none; } .content { padding: 14px; } .grid-2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-logo">
    <h1>JOY CHIN PSA</h1>
    <p>離型紙業務系統</p>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">業務</div>
    <button class="nav-item active" id="nav-inquiry" onclick="switchTab('inquiry')">
      <span class="nav-icon">📋</span><span>詢價管理</span>
    </button>
    <button class="nav-item" id="nav-quotes" onclick="switchTab('quotes')">
      <span class="nav-icon">💰</span><span>報價管理</span>
    </button>
    <div class="nav-section">通訊錄</div>
    <button class="nav-item" id="nav-customers" onclick="switchTab('customers')">
      <span class="nav-icon">👥</span><span>客戶管理</span>
    </button>
    <button class="nav-item" id="nav-suppliers_mgmt" onclick="switchTab('suppliers_mgmt')">
      <span class="nav-icon">🏭</span><span>供應商管理</span>
    </button>
    <div class="nav-section">產品</div>
    <button class="nav-item" id="nav-docs" onclick="switchTab('docs')">
      <span class="nav-icon">📁</span><span>技術文件庫</span>
    </button>
  </nav>
  <div class="sidebar-footer">rey@joy-paper.com</div>
</div>

<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="topbar-title">詢價管理</div>
    <div id="overdue-alert" style="display:none" class="badge"></div>
  </div>
  <div class="content">

    <!-- 詢價管理 -->
    <div id="tab-inquiry">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div id="inq-summary" style="font-size:12px;color:#888"></div>
        <button class="btn btn-primary" onclick="showNewInqForm()">+ 新增詢價</button>
      </div>
      <div class="filter-bar">
        <select id="f-status" onchange="renderInquiries()">
          <option value="">全部狀態</option>
          <option value="pending">待詢供應商</option>
          <option value="asked">已發詢價</option>
          <option value="received">供應商已回</option>
          <option value="sent_to_quote">已送報價</option>
          <option value="closed">已結案</option>
        </select>
        <select id="f-customer" onchange="renderInquiries()"><option value="">全部客戶</option></select>
        <input id="f-product" type="text" placeholder="搜尋產品..." oninput="renderInquiries()" style="max-width:150px" />
        <input id="f-date-from" type="date" onchange="renderInquiries()" style="max-width:140px" />
        <span style="font-size:11px;color:#aaa">至</span>
        <input id="f-date-to" type="date" onchange="renderInquiries()" style="max-width:140px" />
        <button class="btn btn-ghost btn-sm" onclick="clearFilters()">清除</button>
      </div>
      <div id="new-inq-form" class="card" style="display:none;border-color:#0F6E56;background:#f8fffc">
        <div class="section-title" style="color:#085041;margin-bottom:12px">新增客製化詢價</div>
        <div class="grid-2" style="margin-bottom:10px">
          <div>
            <label>客戶 <span class="req">*</span></label>
            <div style="display:flex;gap:6px">
              <select id="nf-customer" style="flex:1"><option value="">— 選擇客戶 —</option></select>
              <button class="btn btn-ghost btn-sm" onclick="switchTab('customers');hideNewInqForm()" style="white-space:nowrap">+ 新客戶</button>
            </div>
          </div>
          <div><label>供應商截止回覆日</label><input id="nf-deadline" type="date" /></div>
        </div>
        <div style="margin-bottom:10px"><label>產品需求 <span class="req">*</span></label><input id="nf-product" placeholder="例：45g 單面矽離型紙" /></div>
        <div style="margin-bottom:10px"><label>規格詳細說明</label><textarea id="nf-spec" placeholder="幅寬、克重、矽化量、表面張力..."></textarea></div>
        <div style="margin-bottom:14px"><label>供應商 <span class="req">*</span></label><select id="nf-supplier"><option value="">— 選擇供應商公司 —</option></select></div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" onclick="createInquiry()">建立詢價單</button>
          <button class="btn btn-ghost" onclick="hideNewInqForm()">取消</button>
        </div>
      </div>
      <div id="inquiry-list"></div>
    </div>

    <!-- 報價管理 -->
    <div id="tab-quotes" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div id="quote-summary" style="font-size:12px;color:#888"></div>
        <button class="btn btn-ghost btn-sm" onclick="openSettingsModal()">⚙ 報價預設值</button>
      </div>
      <div id="quote-list"></div>
    </div>

    <!-- 客戶管理 -->
    <div id="tab-customers" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div id="customer-summary" style="font-size:12px;color:#888"></div>
        <button class="btn btn-primary" onclick="showNewCustomerForm()">+ 新增客戶</button>
      </div>
      <div id="new-customer-form" class="card" style="display:none;border-color:#185FA5;background:#f0f7ff">
        <div class="section-title" style="color:#0C447C;margin-bottom:12px">新增客戶</div>
        <div class="grid-2" style="margin-bottom:10px">
          <div><label>聯絡人姓名 <span class="req">*</span></label><input id="nc-name" placeholder="例：David Chen" /></div>
          <div><label>公司名稱 <span class="req">*</span></label><input id="nc-company" placeholder="例：ABC Packaging Co." /></div>
          <div><label>Email</label><input id="nc-email" placeholder="david@abc.com" /></div>
          <div><label>電話</label><input id="nc-phone" placeholder="+66 81 234 5678" /></div>
          <div><label>國家</label>
            <select id="nc-country">
              <option value="TH">泰國 TH</option><option value="TW">台灣 TW</option>
              <option value="CN">中國 CN</option><option value="SG">新加坡 SG</option>
              <option value="MY">馬來西亞 MY</option><option value="OTHER">其他</option>
            </select>
          </div>
          <div><label>行業</label><input id="nc-industry" placeholder="例：包裝、標籤" /></div>
        </div>
        <div style="margin-bottom:10px"><label>備註</label><textarea id="nc-notes" placeholder="特殊需求、偏好..."></textarea></div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-blue" onclick="createCustomer()">新增</button>
          <button class="btn btn-ghost" onclick="hideNewCustomerForm()">取消</button>
        </div>
      </div>
      <div id="customer-list"></div>
    </div>

    <!-- 供應商管理 -->
    <div id="tab-suppliers_mgmt" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div id="supplier-summary" style="font-size:12px;color:#888"></div>
        <button class="btn btn-primary" onclick="showNewSupplierForm()">+ 新增供應商</button>
      </div>
      <div id="new-supplier-form" class="card" style="display:none;border-color:#0F6E56;background:#f8fffc">
        <div class="section-title" style="color:#085041;margin-bottom:12px">新增供應商聯絡人</div>
        <div class="grid-2" style="margin-bottom:10px">
          <div><label>姓名 <span class="req">*</span></label><input id="ns-name" placeholder="例：王經理" /></div>
          <div><label>公司 <span class="req">*</span></label><input id="ns-company" placeholder="例：裕豐紙業" /></div>
          <div><label>職務</label><input id="ns-role" placeholder="例：業務經理" /></div>
          <div><label>Email <span class="req">*</span></label><input id="ns-email" placeholder="wang@yufeng.com" /></div>
          <div><label>電話</label><input id="ns-phone" placeholder="+886 2 1234 5678" /></div>
          <div><label>LINE ID</label><input id="ns-line" placeholder="wang_yufeng" /></div>
          <div><label>WhatsApp</label><input id="ns-whatsapp" placeholder="+886912345678" /></div>
          <div><label>專長產品</label><input id="ns-specialty" placeholder="矽油離型紙" /></div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" onclick="createSupplier()">新增</button>
          <button class="btn btn-ghost" onclick="hideNewSupplierForm()">取消</button>
        </div>
      </div>
      <div id="supplier-mgmt-list"></div>
    </div>

    <!-- 技術文件庫 -->
    <div id="tab-docs" style="display:none">
      <div style="margin-bottom:12px"><input id="doc-search" placeholder="搜尋產品、文件類型、標籤..." oninput="renderDocs()" /></div>
      <div class="alert-info">業務助理可直接搜尋並複製連結給客戶</div>
      <div id="doc-list"></div>
      <button class="btn btn-ghost" style="width:100%;margin-top:8px;border-style:dashed" onclick="alert('上傳功能即將開放')">+ 上傳新文件</button>
    </div>

  </div>
</div>

<!-- 詢價 Modal -->
<div class="modal-overlay" id="modal-inq" onclick="closeModalOnBg(event,'modal-inq')">
  <div class="modal-box">
    <div class="modal-hd" id="modal-inq-hd"></div>
    <div class="modal-bd" id="modal-inq-bd"></div>
  </div>
</div>

<!-- 客戶編輯 Modal -->
<div class="modal-overlay" id="modal-customer" onclick="closeModalOnBg(event,'modal-customer')">
  <div class="modal-box sm">
    <div class="modal-hd" id="modal-customer-hd"></div>
    <div class="modal-bd" id="modal-customer-bd"></div>
  </div>
</div>

<!-- 供應商編輯 Modal -->
<div class="modal-overlay" id="modal-supplier" onclick="closeModalOnBg(event,'modal-supplier')">
  <div class="modal-box sm">
    <div class="modal-hd" id="modal-supplier-hd"></div>
    <div class="modal-bd" id="modal-supplier-bd"></div>
  </div>
</div>

<!-- 報價設定 Modal -->
<div class="modal-overlay" id="modal-settings" onclick="closeModalOnBg(event,'modal-settings')">
  <div class="modal-box sm">
    <div class="modal-hd">
      <div style="font-size:14px;font-weight:600">報價預設值設定</div>
      <button class="modal-close" onclick="closeModal('modal-settings')">×</button>
    </div>
    <div class="modal-bd" id="modal-settings-bd"></div>
  </div>
</div>

<script>
const SB_URL='https://ckgjcwhlusksqbqvvbma.supabase.co'
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrZ2pjd2hsdXNrc3FicXZ2Ym1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MDMzNzUsImV4cCI6MjA5MjA3OTM3NX0.GQtWWNP_Gd4Zx6S3nNoukVIY8cUXCiGmIe_G9Lyy7fc'
const sb=supabase.createClient(SB_URL,SB_KEY)

const INQ_STATUS=[
  {id:'pending',label:'待詢供應商',color:'#854F0B',bg:'#FAEEDA'},
  {id:'asked',label:'已發詢價',color:'#185FA5',bg:'#E6F1FB'},
  {id:'received',label:'供應商已回',color:'#534AB7',bg:'#EEEDFE'},
  {id:'sent_to_quote',label:'已送報價',color:'#3B6D11',bg:'#EAF3DE'},
  {id:'closed',label:'已結案',color:'#5F5E5A',bg:'#F1EFE8'},
]
const QUO_STATUS=[
  {id:'pending',label:'待報價',color:'#854F0B',bg:'#FAEEDA'},
  {id:'drafted',label:'已草稿',color:'#185FA5',bg:'#E6F1FB'},
  {id:'sent',label:'已報客戶',color:'#534AB7',bg:'#EEEDFE'},
  {id:'accepted',label:'客戶接受',color:'#3B6D11',bg:'#EAF3DE'},
  {id:'rejected',label:'客戶拒絕',color:'#A32D2D',bg:'#FCEBEB'},
  {id:'closed',label:'已結案',color:'#5F5E5A',bg:'#F1EFE8'},
]

let inquiries=[],documents=[],suppliers=[],customers=[],quotes=[],settings={}
let selectedInqId=null,activeTab='inquiry',showTpl=false

async function init(){
  await Promise.all([loadInquiries(),loadDocuments(),loadSuppliers(),loadCustomers(),loadQuotes(),loadSettings()])
  renderInquiries(); renderDocs(); populateFilterCustomers()
}
async function loadInquiries(){const{data}=await sb.from('inquiries').select('*').order('created_at',{ascending:false});inquiries=data||[];updateOverdueAlert()}
async function loadDocuments(){const{data}=await sb.from('documents').select('*').order('product');documents=data||[]}
async function loadSuppliers(){const{data}=await sb.from('suppliers').select('*').order('company');suppliers=data||[]}
async function loadCustomers(){const{data}=await sb.from('customers').select('*').order('company');customers=data||[]}
async function loadQuotes(){const{data}=await sb.from('quotes').select('*').order('created_at',{ascending:false});quotes=data||[]}
async function loadSettings(){const{data}=await sb.from('settings').select('*');settings={};(data||[]).forEach(r=>settings[r.key]=r.value)}

function updateOverdueAlert(){
  const n=inquiries.filter(i=>isOverdue(i)&&!['sent_to_quote','closed'].includes(i.status)).length
  const el=document.getElementById('overdue-alert')
  if(n>0){el.style.display='inline-block';el.setAttribute('style','display:inline-block;background:#FCEBEB;color:#A32D2D;border:1px solid #F09595;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:500');el.textContent='⚠ '+n+' 筆超時'}
  else el.style.display='none'
}
function isOverdue(i){return i.supplier_deadline&&new Date(i.supplier_deadline)<new Date()}
function sObj(id,arr){return (arr||INQ_STATUS).find(s=>s.id===id)||{label:id,color:'#888',bg:'#f0f0f0'}}
function badge(status,arr){const s=sObj(status,arr);return '<span class="badge" style="background:'+s.bg+';color:'+s.color+';border:1px solid '+s.color+'">'+s.label+'</span>'}

const TAB_LABELS={inquiry:'詢價管理',quotes:'報價管理',customers:'客戶管理',suppliers_mgmt:'供應商管理',docs:'技術文件庫'}
function switchTab(tab){
  activeTab=tab
  Object.keys(TAB_LABELS).forEach(t=>{
    const el=document.getElementById('tab-'+t);if(el)el.style.display=t===tab?'block':'none'
    const nav=document.getElementById('nav-'+t);if(nav)nav.classList.toggle('active',t===tab)
  })
  document.getElementById('topbar-title').textContent=TAB_LABELS[tab]||''
  if(tab==='customers')renderCustomers()
  if(tab==='suppliers_mgmt')renderSupplierMgmt()
  if(tab==='quotes')renderQuotes()
}

function populateFilterCustomers(){
  const sel=document.getElementById('f-customer');if(!sel)return
  const cos=[...new Set(inquiries.map(i=>i.customer).filter(Boolean))].sort()
  sel.innerHTML='<option value="">全部客戶</option>'+cos.map(c=>'<option value="'+c+'">'+c+'</option>').join('')
}
function clearFilters(){
  ['f-status','f-customer'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''})
  ['f-product','f-date-from','f-date-to'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''})
  renderInquiries()
}

function renderInquiries(){
  const fS=document.getElementById('f-status')?.value||''
  const fC=document.getElementById('f-customer')?.value||''
  const fP=(document.getElementById('f-product')?.value||'').toLowerCase()
  const fF=document.getElementById('f-date-from')?.value||''
  const fT=document.getElementById('f-date-to')?.value||''
  let list=inquiries.filter(i=>{
    if(fS&&i.status!==fS)return false
    if(fC&&i.customer!==fC)return false
    if(fP&&!i.product?.toLowerCase().includes(fP))return false
    if(fF&&i.created_at<fF)return false
    if(fT&&i.created_at.slice(0,10)>fT)return false
    return true
  })
  const active=list.filter(i=>i.status!=='closed')
  const closed=list.filter(i=>i.status==='closed')
  document.getElementById('inq-summary').textContent=active.length+' 筆進行中 / 共 '+list.length+' 筆'
  let html=active.map(i=>inqRowHtml(i)).join('')
  if(closed.length)html+='<div style="font-size:11px;color:#aaa;margin:12px 0 6px">已結案（'+closed.length+'）</div>'+closed.map(i=>inqRowHtml(i)).join('')
  document.getElementById('inquiry-list').innerHTML=html||'<div class="loading">無符合條件的詢價</div>'
}

function inqRowHtml(i){
  const od=isOverdue(i)&&!['sent_to_quote','closed'].includes(i.status)
  return '<div class="row '+(od?'overdue':'')+'" onclick="openInqModal(\''+i.id+'\')">'+
    '<div style="flex:1;min-width:0">'+
    '<div style="display:flex;align-items:center;gap:7px;margin-bottom:3px;flex-wrap:wrap">'+
    '<span style="font-size:10px;color:#aaa;font-family:monospace">'+i.id+'</span>'+
    '<span style="font-size:13px;font-weight:500">'+i.customer+'</span>'+
    (od?'<span class="overdue-tag">⚠ 超時</span>':'')+
    '</div>'+
    '<div style="font-size:12px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px">'+i.product+'</div>'+
    '<div style="font-size:11px;color:#aaa">'+(i.supplier||'—')+(i.supplier_deadline?' · 截止 '+i.supplier_deadline:'')+'</div>'+
    '</div>'+badge(i.status)+'</div>'

function buildTpl(i,sup){
  const supName=sup.length?sup[0].name:'您好'
  const deadline=i.supplier_deadline||'2天內'
  const text=supName+' 您好，\n\n我司客戶有以下離型紙需求，請協助確認並報價：\n\n【產品規格】\n'+i.product+'\n'+(i.spec||'（規格待補充）')+'\n\n請提供以下資訊：\n1. 貴司是否可以生產此規格？\n2. 生產交期（從確認訂單起算）\n3. 最低起訂量（MOQ）\n4. 原料由貴司提供，請確認原料條件\n5. 報價（含包裝及運至工廠條件，FOB / CIF 請註明）\n6. 如需打樣，打樣費及時間\n\n請於 '+deadline+' 前回覆，謝謝。\n\n此致\nJOY CHIN PSA INCORPORATION CO LTD'
  window._tpl=text
  return '<div style="border-top:1px solid #e5e5e0;padding-top:12px">'+
    '<div style="font-size:11px;font-weight:500;color:#666;margin-bottom:6px">詢問 '+i.supplier+' 的訊息'+
    (sup.length?' <span style="color:#aaa;font-weight:400">收件人：'+sup.map(s=>s.name+'（'+s.email+'）').join('、')+'</span>':'')+
    '</div>'+
    '<div class="tpl-box">'+text+'</div>'+
    '<button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="copyTpl()">複製訊息</button></div>'
}

function toggleTpl(){showTpl=!showTpl;renderInqModalBd()}
function copyTpl(){navigator.clipboard.writeText(window._tpl||'').then(()=>alert('已複製，可貼到 Email 或 WhatsApp'))}

async function updateInqStatus(status){

async function sendToQuote(inqId){
  const i=inquiries.find(x=>x.id===inqId);if(!i)return
  const qId='QUO-'+inqId.replace('INQ-','')
  const{error}=await sb.from('quotes').insert({
    id:qId,inquiry_id:inqId,customer:i.customer,product:i.product,
    spec:i.spec,supplier:i.supplier,cost_price:i.supplier_price,
    customs_fee_pct:parseFloat(settings.default_customs_fee_pct||7.5),
    apply_customs:true,margin_pct:parseFloat(settings.default_margin_pct||20),status:'pending'
  })
  if(error){alert('送去報價失敗：'+error.message);return}
  await sb.from('inquiries').update({status:'sent_to_quote'}).eq('id',inqId)
  await Promise.all([loadInquiries(),loadQuotes()])
  renderInquiries();closeModal('modal-inq');switchTab('quotes')
}

function renderQuotes(){
  const el=document.getElementById('quote-list')
  const sum=document.getElementById('quote-summary')
  if(!el)return
  if(sum)sum.textContent=quotes.filter(q=>q.status!=='closed').length+' 筆待處理'
  if(!quotes.length){el.innerHTML='<div class="loading">尚無報價，從詢價頁按「收到成本 → 送去報價」開始</div>';return}
  el.innerHTML=quotes.map(q=>{
    const cp=parseFloat((q.cost_price||'').match(/[\d.]+/)?.[0]||0)
    const cus=q.apply_customs?(cp*(parseFloat(q.customs_fee_pct||0)/100)):0
    const base=cp+cus
    const final=base*(1+(parseFloat(q.margin_pct||0)/100))
    const unit=(q.cost_price||'').replace(/[\d.]+/,'').trim()||'USD'
    const hasP=cp>0
    return '<div class="card">'+
      '<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:10px">'+
      '<div style="flex:1"><div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:3px">'+
      '<span style="font-size:10px;color:#aaa;font-family:monospace">'+q.id+'</span>'+
      '<span style="font-size:13px;font-weight:500">'+q.customer+'</span></div>'+
      '<div style="font-size:12px;color:#666">'+q.product+'</div>'+
      '<div style="font-size:11px;color:#aaa">供應商：'+(q.supplier||'—')+'</div></div>'+
      badge(q.status,QUO_STATUS)+'</div>'+
      '<div class="grid-2" style="margin-bottom:10px">'+
      '<div><label>供應商成本</label><input value="'+(q.cost_price||'')+'" placeholder="例：USD 2.50/m²" onchange="updQ(\''+q.id+'\',\'cost_price\',this.value)" /></div>'+
      '<div><label style="display:flex;justify-content:space-between"><span>清關手續費 %</span>'+
      '<label style="display:inline-flex;align-items:center;gap:3px;font-size:10px;cursor:pointer">'+
      '<input type="checkbox" '+(q.apply_customs?'checked':'')+' onchange="updQ(\''+q.id+'\',\'apply_customs\',this.checked)" style="width:auto"> 套用</label></label>'+
      '<input type="number" value="'+(q.customs_fee_pct||7.5)+'" min="0" max="50" step="0.5" '+(q.apply_customs?'':'disabled style="opacity:0.4"')+' onchange="updQ(\''+q.id+'\',\'customs_fee_pct\',parseFloat(this.value))" /></div>'+
      '<div><label>加成利潤 %</label><input type="number" value="'+(q.margin_pct||20)+'" min="0" max="200" step="1" onchange="updQ(\''+q.id+'\',\'margin_pct\',parseFloat(this.value))" /></div>'+
      '<div><label>計算結果</label><div style="padding:8px 12px;border-radius:8px;border:1px solid '+(hasP?'#0F6E56':'#e5e5e0')+';background:'+(hasP?'#E1F5EE':'#f8f8f5')+'">'+
      (hasP?'<span style="font-size:15px;font-weight:600;color:#0F6E56">'+final.toFixed(2)+' '+unit+'</span>'+
      '<div style="font-size:10px;color:#0F6E56;margin-top:2px">成本 '+cp.toFixed(2)+' + 清關 '+cus.toFixed(2)+' + 利潤 '+(final-base).toFixed(2)+'</div>':
      '<span style="font-size:12px;color:#aaa">請先填入成本</span>')+'</div></div></div>'+
      '<div style="margin-bottom:10px"><label>備註</label><textarea onchange="updQ(\''+q.id+'\',\'notes\',this.value)">'+(q.notes||'')+'</textarea></div>'+
      '<div class="status-btns">'+QUO_STATUS.map(s=>'<button class="status-btn" style="background:'+(q.status===s.id?s.bg:'transparent')+';color:'+(q.status===s.id?s.color:'#aaa')+';border-color:'+(q.status===s.id?s.color:'#e5e5e0')+'" onclick="updQStatus(\''+q.id+'\',\''+s.id+'\')">'+s.label+'</button>').join('')+'</div></div>'
  }).join('')
}

async function updQ(id,field,value){
  await sb.from('quotes').update({[field]:value}).eq('id',id)
  const q=quotes.find(x=>x.id===id);if(q)q[field]=value
  renderQuotes()
}
async function updQStatus(id,status){
  await sb.from('quotes').update({status}).eq('id',id)
  await loadQuotes();renderQuotes()

function hideNewSupplierForm(){
  document.getElementById('new-supplier-form').style.display='none'
  ;['ns-name','ns-company','ns-role','ns-email','ns-phone','ns-line','ns-whatsapp','ns-specialty'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''})
}

async function createSupplier(){
  const name=document.getElementById('ns-name').value.trim()
  const company=document.getElementById('ns-company').value.trim()
  const email=document.getElementById('ns-email').value.trim()
  if(!name||!company||!email){alert('請填寫姓名、公司和 Email');return}
  const{error}=await sb.from('suppliers').insert({name,company,email,
    role:document.getElementById('ns-role').value.trim()||null,
    phone:document.getElementById('ns-phone').value.trim()||null,
    line_id:document.getElementById('ns-line').value.trim()||null,
    whatsapp:document.getElementById('ns-whatsapp').value.trim()||null,
    specialty:document.getElementById('ns-specialty').value.trim()||null})
  if(error){alert('新增失敗：'+error.message);return}
  await loadSuppliers();hideNewSupplierForm();renderSupplierMgmt()
}

async function deleteSupplier(id,name){
  if(!confirm('確定要刪除「'+name+'」嗎？'))return
  await sb.from('suppliers').delete().eq('id',id)
  await loadSuppliers();renderSupplierMgmt()
}

function openEditSupplier(id){
  const s=suppliers.find(x=>x.id===id);if(!s)return
  document.getElementById('modal-supplier-hd').innerHTML='<div style="font-size:14px;font-weight:600">編輯供應商</div><button class="modal-close" onclick="closeModal(\'modal-supplier\')">×</button>'
  document.getElementById('modal-supplier-bd').innerHTML=
    '<div class="grid-2" style="margin-bottom:10px">'+
    '<div><label>姓名 <span class="req">*</span></label><input id="es-name" value="'+(s.name||'')+'" /></div>'+
    '<div><label>公司 <span class="req">*</span></label><input id="es-company" value="'+(s.company||'')+'" /></div>'+
    '<div><label>職務</label><input id="es-role" value="'+(s.role||'')+'" /></div>'+
    '<div><label>Email <span class="req">*</span></label><input id="es-email" value="'+(s.email||'')+'" /></div>'+
    '<div><label>電話</label><input id="es-phone" value="'+(s.phone||'')+'" /></div>'+
    '<div><label>LINE ID</label><input id="es-line" value="'+(s.line_id||'')+'" /></div>'+
    '<div><label>WhatsApp</label><input id="es-whatsapp" value="'+(s.whatsapp||'')+'" /></div>'+
    '<div><label>專長產品</label><input id="es-specialty" value="'+(s.specialty||'')+'" /></div>'+
    '</div><button class="btn btn-primary" onclick="saveSupplier('+id+')">儲存</button>'
  document.getElementById('modal-supplier').classList.add('open')
}

async function saveSupplier(id){
  const name=document.getElementById('es-name').value.trim()
  const company=document.getElementById('es-company').value.trim()
  const email=document.getElementById('es-email').value.trim()
  if(!name||!company||!email){alert('請填寫姓名、公司和 Email');return}
  await sb.from('suppliers').update({name,company,email,
    role:document.getElementById('es-role').value.trim()||null,
    phone:document.getElementById('es-phone').value.trim()||null,
    line_id:document.getElementById('es-line').value.trim()||null,
    whatsapp:document.getElementById('es-whatsapp').value.trim()||null,
    specialty:document.getElementById('es-specialty').value.trim()||null}).eq('id',id)
  await loadSuppliers();closeModal('modal-supplier');renderSupplierMgmt()
}

function renderDocs(){
  const q=(document.getElementById('doc-search')?.value||'').toLowerCase()
  const filtered=documents.filter(d=>!q||d.product?.toLowerCase().includes(q)||d.doc_type?.toLowerCase().includes(q)||(d.tags||[]).some(t=>t.toLowerCase().includes(q)))
  const products=[...new Set(filtered.map(d=>d.product))]
  let html=''
  if(!products.length)html='<div class="loading">找不到相關文件</div>'
  products.forEach(p=>{
    html+='<div style="font-size:12px;font-weight:500;color:#666;margin:14px 0 6px;padding-bottom:5px;border-bottom:1px solid #e5e5e0">'+p+'</div>'
    filtered.filter(d=>d.product===p).forEach(doc=>{
      html+='<div class="doc-row"><div class="pdf-icon">PDF</div>'+
        '<div style="flex:1"><div style="font-size:12px;font-weight:500">'+doc.doc_type+'</div><div style="font-size:10px;color:#aaa">'+(doc.file_size||'')+'</div></div>'+
        '<div>'+(doc.tags||[]).map(t=>'<span class="tag">'+t+'</span>').join('')+'</div>'+
        '<button class="btn btn-ghost btn-sm" onclick="copyDocLink(\''+( doc.file_url||'#')+'\',\''+doc.doc_type+'\')">複製連結</button></div>'
    })
  })
  document.getElementById('doc-list').innerHTML=html
}

function copyDocLink(url,name){navigator.clipboard.writeText(url).then(()=>alert('已複製：'+name+' 的連結')).catch(()=>alert('請手動複製'))}
